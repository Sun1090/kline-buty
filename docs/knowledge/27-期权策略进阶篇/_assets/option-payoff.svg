<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bgp1)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">期权盈亏形态 —— 三种经典结构的到期损益曲线</text>

  <!-- ================= Panel 1: Long Straddle 买入跨式 ================= -->
  <text x="150" y="72" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">① 买入跨式 Long Straddle</text>
  <text x="150" y="92" fill="#8fa3c8" font-size="11.5" text-anchor="middle">赌「走多大」· 大涨大跌都赚</text>
  <!-- axes: panel center x=150, payoff vertex y=250, range x 30..270 -->
  <line x1="35" y1="330" x2="272" y2="330" stroke="#3d4a6b" stroke-width="1.5"/>
  <line x1="150" y1="100" x2="150" y2="345" stroke="#3d4a6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- V payoff -->
  <polyline points="45,120 150,250 262,120" fill="none" stroke="#4e9cf5" stroke-width="3"/>
  <!-- max loss tick -->
  <text x="150" y="268" fill="#ef5350" font-size="11" text-anchor="middle">最大亏损 = 双份权利金</text>
  <text x="60" y="112" fill="#26a69a" font-size="11">涨破 → 盈利</text>
  <text x="196" y="112" fill="#26a69a" font-size="11">跌破 → 盈利</text>
  <text x="150" y="352" fill="#8fa3c8" font-size="11" text-anchor="middle">行权价 K</text>

  <!-- ================= Panel 2: Bull Call Spread 牛市价差 ================= -->
  <text x="410" y="72" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">② 牛市价差 Bull Call Spread</text>
  <text x="410" y="92" fill="#8fa3c8" font-size="11.5" text-anchor="middle">赌「往哪走」· 涨了赚，亏损有限</text>
  <line x1="295" y1="330" x2="532" y2="330" stroke="#3d4a6b" stroke-width="1.5"/>
  <line x1="370" y1="100" x2="370" y2="345" stroke="#3d4a6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="460" y1="100" x2="460" y2="345" stroke="#3d4a6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- payoff: flat loss until K1, rise, flat max gain after K2 -->
  <polyline points="305,290 370,290 460,170 522,170" fill="none" stroke="#e8b56e" stroke-width="3"/>
  <text x="330" y="308" fill="#ef5350" font-size="11">最大亏损 = 净权利金</text>
  <text x="472" y="162" fill="#26a69a" font-size="11">最大盈利封顶</text>
  <text x="370" y="352" fill="#8fa3c8" font-size="11" text-anchor="middle">低行权价 K1</text>
  <text x="460" y="352" fill="#8fa3c8" font-size="11" text-anchor="middle">高行权价 K2</text>

  <!-- ================= Panel 3: Iron Condor 铁鹰 ================= -->
  <text x="670" y="72" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">③ 铁鹰 Iron Condor</text>
  <text x="670" y="92" fill="#8fa3c8" font-size="11.5" text-anchor="middle">赌「别大走」· 不动才赚</text>
  <line x1="555" y1="330" x2="792" y2="330" stroke="#3d4a6b" stroke-width="1.5"/>
  <line x1="595" y1="100" x2="595" y2="345" stroke="#3d4a6b" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="645" y1="100" x2="645" y2="345" stroke="#3d4a6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="700" y1="100" x2="700" y2="345" stroke="#3d4a6b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="750" y1="100" x2="750" y2="345" stroke="#3d4a6b" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- payoff: flat loss, rise to plateau, fall, flat loss -->
  <polyline points="565,285 595,285 645,185 700,185 750,285 785,285" fill="none" stroke="#26a69a" stroke-width="3"/>
  <text x="672" y="172" fill="#26a69a" font-size="11" text-anchor="middle">中间不动 → 赚权利金</text>
  <text x="580" y="308" fill="#ef5350" font-size="10.5">大跌破翼</text>
  <text x="742" y="308" fill="#ef5350" font-size="10.5">大涨破翼</text>
  <text x="645" y="352" fill="#8fa3c8" font-size="10.5" text-anchor="middle">Put 卖出</text>
  <text x="700" y="352" fill="#8fa3c8" font-size="10.5" text-anchor="middle">Call 卖出</text>

  <!-- ================= bottom summary ================= -->
  <line x1="60" y1="378" x2="740" y2="378" stroke="#3d4a6b" stroke-width="1"/>
  <text x="400" y="406" fill="#c8d3ea" font-size="13" text-anchor="middle">横轴 = 到期标的价格 · 纵轴 = 盈亏 · 三条曲线对应总览表里的三类赌注：走多大 / 往哪走 / 别大走</text>
</svg>
