<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgbt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgbt)" rx="16"/>
  <text x="400" y="32" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">黑天鹅时间轴 —— 极端日子存在且会重复，风控必须为其而设</text>

  <!-- axis -->
  <line x1="60" y1="220" x2="740" y2="220" stroke="#8fa3c8" stroke-width="3" marker-end="url(#arrBT)"/>

  <!-- events above axis -->
  <circle cx="140" cy="220" r="7" fill="#ef5350"/>
  <text x="140" y="130" fill="#ff9d9d" font-size="13" font-weight="700" text-anchor="middle">1987.10 黑色星期一</text>
  <text x="140" y="152" fill="#8fa3c8" font-size="11.5" text-anchor="middle">程序化交易 · 一日 -22.6%</text>
  <line x1="140" y1="160" x2="140" y2="213" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="330" cy="220" r="7" fill="#ef5350"/>
  <text x="330" y="120" fill="#ff9d9d" font-size="13" font-weight="700" text-anchor="middle">2008.09 雷曼倒闭</text>
  <text x="330" y="142" fill="#8fa3c8" font-size="11.5" text-anchor="middle">一家投行 → 全球信贷冻结</text>
  <line x1="330" y1="150" x2="330" y2="213" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="490" cy="220" r="7" fill="#ef5350"/>
  <text x="490" y="110" fill="#ff9d9d" font-size="13" font-weight="700" text-anchor="middle">2010.05 闪崩</text>
  <text x="490" y="132" fill="#8fa3c8" font-size="11.5" text-anchor="middle">高频交易 · 5 分钟 -9%</text>
  <line x1="490" y1="140" x2="490" y2="213" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="4 3"/>

  <circle cx="640" cy="220" r="7" fill="#ef5350"/>
  <text x="640" y="120" fill="#ff9d9d" font-size="13" font-weight="700" text-anchor="middle">2015 中国股灾</text>
  <text x="640" y="142" fill="#8fa3c8" font-size="11.5" text-anchor="middle">千股跌停 · 杠杆牛崩塌</text>
  <line x1="640" y1="150" x2="640" y2="213" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- bottom rule -->
  <rect x="100" y="280" width="600" height="70" rx="12" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="306" fill="#ff9d9d" font-size="14" font-weight="700" text-anchor="middle">永远假设「极端日子」存在</text>
  <text x="400" y="330" fill="#c8d3ea" font-size="13" text-anchor="middle">你的止损/风控必须能在 -20% 以上的单日行情中生存</text>

  <text x="400" y="380" fill="#8fa3c8" font-size="12.5" text-anchor="middle">共同点：没人精准预测到；爆发前毫无征兆或信号被无视；修复需要数月到数年</text>

  <defs><marker id="arrBT" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8fa3c8"/></marker></defs>
</svg>