<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgc1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="arrowc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4e9cf5"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef5350"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="url(#bgc1)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">套息交易流程 —— 借低息货币，持有高息货币，赚利差</text>

  <!-- Step 1 -->
  <rect x="40" y="80" width="200" height="110" rx="12" fill="#182238" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="140" y="112" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">① 借入低息货币</text>
  <text x="140" y="140" fill="#8fa3c8" font-size="12.5" text-anchor="middle">日元 JPY · 年利率 0.5%</text>
  <text x="140" y="164" fill="#8fa3c8" font-size="12.5" text-anchor="middle">借 100 万日元，留下还债义务</text>

  <!-- Step 2 -->
  <rect x="300" y="80" width="200" height="110" rx="12" fill="#182238" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="400" y="112" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">② 换成高息货币</text>
  <text x="400" y="140" fill="#8fa3c8" font-size="12.5" text-anchor="middle">AUD/JPY = 100</text>
  <text x="400" y="164" fill="#8fa3c8" font-size="12.5" text-anchor="middle">换成 1 万澳元，承担汇率敞口</text>

  <!-- Step 3 -->
  <rect x="560" y="80" width="200" height="110" rx="12" fill="#182238" stroke="#26a69a" stroke-width="1.5"/>
  <text x="660" y="112" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">③ 持有高息资产</text>
  <text x="660" y="140" fill="#26a69a" font-size="12.5" text-anchor="middle">澳元存款/国债 · 年利率 4%</text>
  <text x="660" y="164" fill="#8fa3c8" font-size="12.5" text-anchor="middle">每年净赚利差 3.5%</text>

  <!-- arrows forward -->
  <line x1="240" y1="135" x2="296" y2="135" stroke="#4e9cf5" stroke-width="2.5" marker-end="url(#arrowc)"/>
  <line x1="500" y1="135" x2="556" y2="135" stroke="#4e9cf5" stroke-width="2.5" marker-end="url(#arrowc)"/>

  <!-- Step 4: close the loop -->
  <rect x="300" y="250" width="200" height="96" rx="12" fill="#182238" stroke="#e8b56e" stroke-width="1.5"/>
  <text x="400" y="284" fill="#eef2ff" font-size="15" font-weight="700" text-anchor="middle">④ 到期换回日元还债</text>
  <text x="400" y="310" fill="#8fa3c8" font-size="12.5" text-anchor="middle">汇率没大动 → 利差落袋</text>
  <path d="M 660 190 C 660 240 560 262 504 288" fill="none" stroke="#e8b56e" stroke-width="2.5" marker-end="url(#arrowc)"/>
  <path d="M 300 320 C 200 330 130 260 133 194" fill="none" stroke="#e8b56e" stroke-width="2.5" marker-end="url(#arrowc)"/>

  <!-- Risk branch -->
  <rect x="560" y="250" width="210" height="96" rx="12" fill="#2a1620" stroke="#ef5350" stroke-width="1.8"/>
  <text x="665" y="280" fill="#ef5350" font-size="14.5" font-weight="700" text-anchor="middle">⚠ 风险：汇率反向波动</text>
  <text x="665" y="304" fill="#c8d3ea" font-size="12" text-anchor="middle">日元急涨 → 全市场踩踏平仓</text>
  <text x="665" y="326" fill="#c8d3ea" font-size="12" text-anchor="middle">3.5% 利差 ≠ 无风险（见 2024.8）</text>
  <line x1="665" y1="246" x2="665" y2="230" stroke="#ef5350" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowr)"/>

  <!-- bottom note -->
  <text x="400" y="396" fill="#8fa3c8" font-size="13" text-anchor="middle">利差是「小而确定」的收益，汇率敞口是「大而突发」的风险 —— 加杠杆会把后者放大到吞掉全部本金</text>
</svg>
