<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="430" fill="url(#bgc)" rx="16"/>
  <text x="400" y="36" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">单根 K 线反转信号速记（地点决定含义）</text>

  <!-- Hammer -->
  <g>
    <text x="110" y="72" fill="#7ce0d0" font-size="15" font-weight="700" text-anchor="middle">锤子线（Hammer）</text>
    <line x1="110" y1="340" x2="110" y2="140" stroke="#7ce0d0" stroke-width="3"/>
    <rect x="85" y="220" width="50" height="84" fill="#1e392f" stroke="#26a69a" stroke-width="2.5"/>
    <line x1="110" y1="220" x2="110" y2="180" stroke="#26a69a" stroke-width="3"/>
    <text x="110" y="372" fill="#8fa3c8" font-size="12" text-anchor="middle">长下影 + 小实体</text>
    <text x="110" y="390" fill="#6fc5b8" font-size="12.5" text-anchor="middle">**下降趋势末端**出现</text>
    <text x="110" y="408" fill="#5f6f95" font-size="11.5" text-anchor="middle">→ 下跌动能衰竭，可能见底</text>
  </g>

  <!-- Hanging man -->
  <g>
    <text x="300" y="72" fill="#ef7a7a" font-size="15" font-weight="700" text-anchor="middle">上吊线（Hanging Man）</text>
    <line x1="300" y1="340" x2="300" y2="140" stroke="#ef5350" stroke-width="3"/>
    <rect x="275" y="220" width="50" height="84" fill="#3d2020" stroke="#ef5350" stroke-width="2.5"/>
    <line x1="300" y1="220" x2="300" y2="180" stroke="#ef5350" stroke-width="3"/>
    <text x="300" y="372" fill="#8fa3c8" font-size="12" text-anchor="middle">形态一模一样</text>
    <text x="300" y="390" fill="#ef7a7a" font-size="12.5" text-anchor="middle">**上升趋势末端**出现</text>
    <text x="300" y="408" fill="#5f6f95" font-size="11.5" text-anchor="middle">→ 上涨动能衰竭，可能见顶</text>
  </g>

  <!-- Engulfing -->
  <g>
    <text x="500" y="72" fill="#ffd3d3" font-size="15" font-weight="700" text-anchor="middle">吞没形态（Engulfing）</text>
    <line x1="470" y1="300" x2="470" y2="180" stroke="#ef5350" stroke-width="3"/>
    <rect x="452" y="210" width="36" height="70" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>  <!-- first small down -->
    <line x1="490" y1="330" x2="490" y2="150" stroke="#26a69a" stroke-width="3"/>
    <rect x="472" y="200" width="36" height="90" fill="#1e392f" stroke="#26a69a" stroke-width="2.5"/> <!-- second big up engulfs -->
    <text x="500" y="372" fill="#8fa3c8" font-size="12" text-anchor="middle">第二根实体完全包住前一根</text>
    <text x="500" y="390" fill="#7ce0d0" font-size="12.5" text-anchor="middle">阳线吞阴线 = 看涨吞没（底部）</text>
    <text x="500" y="408" fill="#ef7a7a" font-size="11.5" text-anchor="middle">阴线吞阳线 = 看跌吞没（顶部）</text>
  </g>

  <!-- Doji -->
  <g>
    <text x="690" y="72" fill="#ffd9a0" font-size="15" font-weight="700" text-anchor="middle">十字星（Doji）</text>
    <line x1="690" y1="340" x2="690" y2="160" stroke="#e8b56e" stroke-width="3"/>
    <line x1="660" y1="250" x2="720" y2="250" stroke="#e8b56e" stroke-width="4"/> <!-- open=close thin line -->
    <line x1="690" y1="160" x2="690" y2="340" stroke="#e8b56e" stroke-width="2"/> <!-- doji wicks span -->
    <text x="690" y="372" fill="#8fa3c8" font-size="12" text-anchor="middle">开≈收，多空拉锯一瞬间</text>
    <text x="690" y="390" fill="#ffd9a0" font-size="12.5" text-anchor="middle">长十字 / 高位十字更有效</text>
    <text x="690" y="408" fill="#5f6f95" font-size="11.5" text-anchor="middle">→ 常是变盘信号，不直接定方向</text>
  </g>
</svg>