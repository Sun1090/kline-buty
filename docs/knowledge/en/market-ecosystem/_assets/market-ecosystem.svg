<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bgme" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="arrME" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8fa3c8"/></marker>
  </defs>
  <rect width="780" height="480" fill="url(#bgme)" rx="16"/>
  <text x="390" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">Market Participant Ecosystem — Capital Flows from Top to Bottom</text>

  <!-- top: central banks -->
  <rect x="270" y="56" width="240" height="46" rx="10" fill="#31281a" stroke="#e8b56e" stroke-width="2"/>
  <text x="390" y="75" fill="#ffd9a0" font-size="14" font-weight="700" text-anchor="middle">Central Banks & Governments</text>
  <text x="390" y="93" fill="#8fa3c8" font-size="11" text-anchor="middle">Monetary & Regulatory Environment</text>
  <!-- arrows down -->
  <line x1="330" y1="102" x2="170" y2="132" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>
  <line x1="390" y1="102" x2="390" y2="132" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>
  <line x1="450" y1="102" x2="610" y2="132" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>

  <!-- layer 1: big players -->
  <rect x="40" y="136" width="215" height="58" rx="10" fill="#12203a" stroke="#4e9cf5" stroke-width="1.8"/>
  <text x="147" y="158" fill="#a7c8ff" font-size="13" font-weight="700" text-anchor="middle">"National Team" Huijin / Social Security</text>
  <text x="147" y="178" fill="#8fa3c8" font-size="11.5" text-anchor="middle">Market support / stabilization</text>
  <rect x="282" y="136" width="215" height="58" rx="10" fill="#12203a" stroke="#4e9cf5" stroke-width="1.8"/>
  <text x="390" y="158" fill="#a7c8ff" font-size="13" font-weight="700" text-anchor="middle">Institutional Investors</text>
  <text x="390" y="178" fill="#8fa3c8" font-size="11.5" text-anchor="middle">Mutual funds / private funds / insurers / pensions</text>
  <rect x="524" y="136" width="215" height="58" rx="10" fill="#12203a" stroke="#4e9cf5" stroke-width="1.8"/>
  <text x="631" y="158" fill="#a7c8ff" font-size="13" font-weight="700" text-anchor="middle">Foreign Capital / Major Shareholders</text>
  <text x="631" y="178" fill="#8fa3c8" font-size="11.5" text-anchor="middle">Northbound / QFII / stake changes</text>
  <line x1="147" y1="194" x2="245" y2="222" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>
  <line x1="390" y1="194" x2="390" y2="222" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>
  <line x1="631" y1="194" x2="537" y2="222" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>

  <!-- layer 2: market makers + hft -->
  <rect x="120" y="228" width="255" height="58" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.8"/>
  <text x="247" y="250" fill="#c8d3ea" font-size="13" font-weight="700" text-anchor="middle">Market Makers</text>
  <text x="247" y="270" fill="#8fa3c8" font-size="11.5" text-anchor="middle">Provide liquidity, earn the spread</text>
  <rect x="405" y="228" width="255" height="58" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.8"/>
  <text x="532" y="250" fill="#c8d3ea" font-size="13" font-weight="700" text-anchor="middle">High-Frequency Traders (HFT)</text>
  <text x="532" y="270" fill="#8fa3c8" font-size="11.5" text-anchor="middle">Micro-profits via speed and tiny spreads</text>
  <line x1="330" y1="286" x2="390" y2="314" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arrME)"/>

  <!-- layer 3: retail -->
  <rect x="265" y="320" width="250" height="58" rx="10" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
  <text x="390" y="342" fill="#ff9d9d" font-size="14" font-weight="700" text-anchor="middle">Retail Investors</text>
  <text x="390" y="362" fill="#8fa3c8" font-size="11.5" text-anchor="middle">Last in information, smallest in size, heaviest in emotion</text>

  <text x="390" y="412" fill="#c8d3ea" font-size="13" text-anchor="middle">Where money goes: central banks → big capital → makers/HFT → retail (the harvested)</text>
  <text x="390" y="436" fill="#8fa3c8" font-size="12" text-anchor="middle">Crypto extras: whales (large on-chain holders) and miners/validators (passive sellers)</text>
  <text x="390" y="460" fill="#5f6f95" font-size="12" text-anchor="middle">💡 Retail takeaway: never out-info or out-speed institutions — compete on directional insight and position discipline.</text>
</svg>