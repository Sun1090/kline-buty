<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgmc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bgmc2)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">股票 vs 期货 vs 现货 —— 三类标的的本质差异</text>

  <!-- 3 columns -->
  <g font-size="12.5">
    <!-- stocks -->
    <rect x="40" y="60" width="232" height="230" rx="12" fill="#12203a" stroke="#4e9cf5" stroke-width="2"/>
    <text x="156" y="86" fill="#a7c8ff" font-size="14" font-weight="700" text-anchor="middle">股票</text>
    <text x="156" y="110" fill="#c8d3ea" text-anchor="middle">所有权凭证 · 永久持有</text>
    <text x="156" y="136" fill="#8fa3c8" text-anchor="middle">做空：融券门槛高</text>
    <text x="156" y="160" fill="#8fa3c8" text-anchor="middle">杠杆：无（融资融券除外）</text>
    <text x="156" y="184" fill="#8fa3c8" text-anchor="middle">涨跌幅：主板 ±10%</text>
    <text x="156" y="208" fill="#7ce0d0" text-anchor="middle">不爆仓（最多套牢）</text>
    <text x="156" y="240" fill="#5f6f95" text-anchor="middle">收益：分红 + 价差</text>
    <text x="156" y="264" fill="#5f6f95" text-anchor="middle">风险等级：中</text>

    <!-- futures -->
    <rect x="284" y="60" width="232" height="230" rx="12" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
    <text x="400" y="86" fill="#ff9d9d" font-size="14" font-weight="700" text-anchor="middle">期货</text>
    <text x="400" y="110" fill="#c8d3ea" text-anchor="middle">远期合约 · 有到期日</text>
    <text x="400" y="136" fill="#8fa3c8" text-anchor="middle">做空：天然可做空</text>
    <text x="400" y="160" fill="#8fa3c8" text-anchor="middle">杠杆：保证金 5%~15%</text>
    <text x="400" y="184" fill="#8fa3c8" text-anchor="middle">涨跌幅：±4%~±10%</text>
    <text x="400" y="208" fill="#ef7a7a" text-anchor="middle">会爆仓强平 💀</text>
    <text x="400" y="240" fill="#5f6f95" text-anchor="middle">收益：价差（零和为主）</text>
    <text x="400" y="264" fill="#5f6f95" text-anchor="middle">风险等级：高</text>

    <!-- spot -->
    <rect x="528" y="60" width="232" height="230" rx="12" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
    <text x="644" y="86" fill="#7ce0d0" font-size="14" font-weight="700" text-anchor="middle">现货</text>
    <text x="644" y="110" fill="#c8d3ea" text-anchor="middle">一手交钱一手交货</text>
    <text x="644" y="136" fill="#8fa3c8" text-anchor="middle">做空：一般只能做多</text>
    <text x="644" y="160" fill="#8fa3c8" text-anchor="middle">杠杆：无</text>
    <text x="644" y="184" fill="#8fa3c8" text-anchor="middle">涨跌幅：无限制</text>
    <text x="644" y="208" fill="#7ce0d0" text-anchor="middle">不爆仓（最多套牢）</text>
    <text x="644" y="240" fill="#5f6f95" text-anchor="middle">收益：价差</text>
    <text x="644" y="264" fill="#5f6f95" text-anchor="middle">风险等级：低</text>
  </g>

  <!-- bottom key -->
  <rect x="120" y="318" width="560" height="86" rx="12" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="344" fill="#c8d3ea" font-size="13.5" text-anchor="middle">一句话看懂三个市场：</text>
  <text x="400" y="368" fill="#ffd9a0" font-size="13" text-anchor="middle">股票是「拥有一家公司的一部分」· 期货是「对赌未来价格的远期合约」· 现货是「一手交钱一手交货」</text>
  <text x="400" y="392" fill="#8fa3c8" font-size="12" text-anchor="middle">风险排序：期货（高杠杆会爆仓）&gt; 股票（可套牢不爆仓）&gt; 现货（最低）</text>
</svg>