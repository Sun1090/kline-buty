<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bgv)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">量价配合 —— 价格是面子，量是里子</text>

  <!-- price candles -->
  <g stroke-width="2">
    <!-- up -->
    <line x1="80" y1="120" x2="80" y2="40" stroke="#26a69a"/><rect x="62" y="70" width="36" height="50" fill="#1e392f" stroke="#26a69a"/>
    <line x1="160" y1="100" x2="160" y2="30" stroke="#26a69a"/><rect x="142" y="52" width="36" height="48" fill="#1e392f" stroke="#26a69a"/>
    <line x1="240" y1="90" x2="240" y2="20" stroke="#26a69a"/><rect x="222" y="42" width="36" height="48" fill="#1e392f" stroke="#26a69a"/>
    <line x1="320" y1="120" x2="320" y2="45" stroke="#26a69a"/><rect x="302" y="70" width="36" height="50" fill="#1e392f" stroke="#26a69a"/>
    <line x1="400" y1="100" x2="400" y2="30" stroke="#26a69a"/><rect x="382" y="55" width="36" height="45" fill="#1e392f" stroke="#26a69a"/>
    <!-- down -->
    <line x1="480" y1="60" x2="480" y2="140" stroke="#ef5350"/><rect x="462" y="75" width="36" height="45" fill="#3d2020" stroke="#ef5350"/>
    <line x1="560" y1="75" x2="560" y2="150" stroke="#ef5350"/><rect x="542" y="90" width="36" height="50" fill="#3d2020" stroke="#ef5350"/>
    <line x1="640" y1="85" x2="640" y2="160" stroke="#ef5350"/><rect x="622" y="100" width="36" height="50" fill="#3d2020" stroke="#ef5350"/>
  </g>

  <text x="80" y="190" fill="#7ce0d0" font-size="13" text-anchor="middle">放量上涨</text>
  <text x="240" y="190" fill="#7ce0d0" font-size="13" text-anchor="middle">缩量上涨⚠</text>
  <text x="400" y="190" fill="#ffd9a0" font-size="13" text-anchor="middle">放量滞涨⚠</text>
  <text x="560" y="190" fill="#ef7a7a" font-size="13" text-anchor="middle">放量下跌</text>

  <!-- volume bars -->
  <rect x="62" y="240" width="36" height="80" fill="#26a69a" opacity="0.85"/>
  <rect x="142" y="280" width="36" height="40" fill="#26a69a" opacity="0.4"/>
  <rect x="222" y="285" width="36" height="35" fill="#26a69a" opacity="0.35"/>
  <rect x="302" y="225" width="36" height="95" fill="#e8b56e" opacity="0.9"/>
  <rect x="382" y="260" width="36" height="60" fill="#26a69a" opacity="0.6"/>
  <rect x="462" y="215" width="36" height="105" fill="#ef5350" opacity="0.9"/>
  <rect x="542" y="250" width="36" height="70" fill="#ef5350" opacity="0.6"/>
  <rect x="622" y="265" width="36" height="55" fill="#ef5350" opacity="0.45"/>

  <line x1="40" y1="235" x2="700" y2="235" stroke="#3d4a6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="258" fill="#8fa3c8" font-size="12" text-anchor="middle">成交量柱（对应上方 K 线）</text>

  <text x="400" y="352" fill="#c8d3ea" font-size="14" text-anchor="middle">一句话：量是价格的「燃料」——没有量的涨跌走不远。</text>
  <text x="400" y="380" fill="#8fa3c8" font-size="12.5" text-anchor="middle">放量突破才可信；缩量新高=动能衰减；暴跌放量=恐慌；缩量阴跌=接近尾声。</text>
</svg>