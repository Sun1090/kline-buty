<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="-apple-system, sans-serif">
  <rect width="720" height="280" fill="#1a1a2e"/>
  <text x="360" y="26" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">三种风险偏好的加密组合配置</text>

  <!-- Conservative -->
  <text x="130" y="60" text-anchor="middle" fill="#64b3f4" font-size="13" font-weight="bold">保守型</text>
  <circle cx="130" cy="150" r="70" fill="none"/>
  <!-- BTC 60% -->
  <path d="M 130 80 A 70 70 0 1 1 69.4 185" fill="#f7931a" opacity="0.85"/>
  <!-- ETH 20% -->
  <path d="M 69.4 185 A 70 70 0 0 1 130 220" fill="#627eea" opacity="0.85"/>
  <!-- Alt 10% -->
  <path d="M 130 220 A 70 70 0 0 1 160 213.8" fill="#ef4565" opacity="0.7"/>
  <!-- Stable 10% -->
  <path d="M 160 213.8 A 70 70 0 0 1 130 80" fill="#26a17b" opacity="0.7"/>

  <!-- Balanced -->
  <text x="360" y="60" text-anchor="middle" fill="#ffd166" font-size="13" font-weight="bold">平衡型</text>
  <circle cx="360" cy="150" r="70" fill="none"/>
  <path d="M 360 80 A 70 70 0 0 1 425.6 115" fill="#f7931a" opacity="0.85"/>
  <path d="M 425.6 115 A 70 70 0 0 1 409.5 205" fill="#627eea" opacity="0.85"/>
  <path d="M 409.5 205 A 70 70 0 0 1 330.2 217.1" fill="#ef4565" opacity="0.7"/>
  <path d="M 330.2 217.1 A 70 70 0 0 1 290.5 185" fill="#c084fc" opacity="0.6"/>
  <path d="M 290.5 185 A 70 70 0 0 1 360 80" fill="#26a17b" opacity="0.7"/>

  <!-- Aggressive -->
  <text x="590" y="60" text-anchor="middle" fill="#ef4565" font-size="13" font-weight="bold">进取型</text>
  <circle cx="590" cy="150" r="70" fill="none"/>
  <path d="M 590 80 A 70 70 0 0 1 656.5 180.6" fill="#f7931a" opacity="0.85"/>
  <path d="M 656.5 180.6 A 70 70 0 0 1 620 216.5" fill="#627eea" opacity="0.85"/>
  <path d="M 620 216.5 A 70 70 0 0 1 520 150" fill="#ef4565" opacity="0.7"/>
  <path d="M 520 150 A 70 70 0 0 1 549.5 93.7" fill="#c084fc" opacity="0.6"/>
  <path d="M 549.5 93.7 A 70 70 0 0 1 590 80" fill="#26a17b" opacity="0.7"/>

  <!-- Legend -->
  <rect x="200" y="248" width="12" height="12" rx="2" fill="#f7931a"/><text x="218" y="258" fill="#8892b0" font-size="11">BTC</text>
  <rect x="270" y="248" width="12" height="12" rx="2" fill="#627eea"/><text x="288" y="258" fill="#8892b0" font-size="11">ETH</text>
  <rect x="340" y="248" width="12" height="12" rx="2" fill="#ef4565"/><text x="358" y="258" fill="#8892b0" font-size="11">大市值山寨</text>
  <rect x="450" y="248" width="12" height="12" rx="2" fill="#c084fc"/><text x="468" y="258" fill="#8892b0" font-size="11">小市值/新项目</text>
  <rect x="580" y="248" width="12" height="12" rx="2" fill="#26a17b"/><text x="598" y="258" fill="#8892b0" font-size="11">稳定币</text>
</svg>
