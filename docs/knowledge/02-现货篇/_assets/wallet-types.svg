<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="-apple-system, sans-serif">
  <rect width="720" height="320" fill="#1a1a2e"/>
  <text x="360" y="28" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">热钱包 vs 冷钱包：安全边界</text>
  <rect x="40" y="56" width="300" height="230" rx="8" fill="#16213e" stroke="#ef4565" stroke-width="1.5"/>
  <text x="190" y="82" text-anchor="middle" fill="#ef4565" font-size="14" font-weight="bold">热钱包（联网）</text>
  <ellipse cx="190" cy="120" rx="60" ry="25" fill="#ef456522" stroke="#ef4565"/>
  <text x="190" y="125" text-anchor="middle" fill="#ef4565" font-size="11">互联网</text>
  <line x1="80" y1="150" x2="140" y2="130" stroke="#ef4565" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="70" y="160" fill="#ef4565" font-size="10" text-anchor="end">恶意软件</text>
  <line x1="80" y1="180" x2="140" y2="165" stroke="#ef4565" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="70" y="190" fill="#ef4565" font-size="10" text-anchor="end">钓鱼网站</text>
  <line x1="80" y1="210" x2="140" y2="195" stroke="#ef4565" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <text x="70" y="220" fill="#ef4565" font-size="10" text-anchor="end">剪贴板劫持</text>
  <rect x="155" y="145" width="70" height="110" rx="8" fill="#2a2a4a" stroke="#666"/>
  <rect x="163" y="153" width="54" height="90" rx="4" fill="#0d1117"/>
  <text x="190" y="200" text-anchor="middle" fill="#8892b0" font-size="10">手机/电脑</text>
  <text x="190" y="215" text-anchor="middle" fill="#ffd166" font-size="9">私钥在本地</text>
  <text x="190" y="272" text-anchor="middle" fill="#ef4565" font-size="12">风险：中高</text>
  <rect x="380" y="56" width="300" height="230" rx="8" fill="#16213e" stroke="#4caf87" stroke-width="1.5"/>
  <text x="530" y="82" text-anchor="middle" fill="#4caf87" font-size="14" font-weight="bold">硬件钱包（离线）</text>
  <line x1="430" y1="170" x2="480" y2="170" stroke="#4caf87" stroke-width="2"/>
  <text x="420" y="174" text-anchor="end" fill="#8892b0" font-size="10">USB</text>
  <rect x="485" y="135" width="80" height="50" rx="6" fill="#2a2a4a" stroke="#4caf87" stroke-width="1.5"/>
  <rect x="493" y="142" width="40" height="30" rx="3" fill="#0d1117"/>
  <text x="513" y="161" text-anchor="middle" fill="#4caf87" font-size="8">确认 ✓</text>
  <circle cx="550" cy="160" r="6" fill="#4caf87"/>
  <text x="530" y="205" text-anchor="middle" fill="#4caf87" font-size="12">私钥永不触网</text>
  <text x="530" y="222" text-anchor="middle" fill="#8892b0" font-size="10">签名在芯片内完成</text>
  <text x="530" y="238" text-anchor="middle" fill="#8892b0" font-size="10">即使电脑中毒也无法提取私钥</text>
  <text x="530" y="272" text-anchor="middle" fill="#4caf87" font-size="12">风险：低</text>
  <marker id="arrowR" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
    <path d="M0,0 L6,2 L0,4 Z" fill="#ef4565"/>
  </marker>
</svg>
