<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgcl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="430" fill="url(#bgcl)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">画线工具三分类 —— 定位 · 连接 · 比例（先有假设，再画线）</text>

  <!-- skeleton price line -->
  <path d="M 60 340 C 140 320 180 280 230 290 S 330 210 380 225 S 480 160 540 180 S 660 120 740 140" fill="none" stroke="#8fa3c8" stroke-width="2" opacity="0.5"/>

  <!-- horizontal support/resistance -->
  <line x1="50" y1="220" x2="200" y2="220" stroke="#4e9cf5" stroke-width="2.8"/>
  <text x="125" y="212" fill="#4e9cf5" font-size="12" text-anchor="middle">阻力（定位-水平线）</text>
  <line x1="50" y1="330" x2="200" y2="330" stroke="#26a69a" stroke-width="2.8"/>
  <text x="125" y="322" fill="#26a69a" font-size="12" text-anchor="middle">支撑</text>

  <!-- trend line -->
  <line x1="250" y1="300" x2="460" y2="205" stroke="#e8b56e" stroke-width="2.8"/>
  <text x="330" y="250" fill="#e8b56e" font-size="12" text-anchor="middle" transform="rotate(-22 330 250)">趋势线（连接）</text>

  <!-- channel -->
  <line x1="250" y1="215" x2="460" y2="120" stroke="#e8b56e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="305" y="175" fill="#8fa3c8" font-size="11" text-anchor="middle" transform="rotate(-22 305 175)">平行通道（连接）</text>

  <!-- fib retracement -->
  <line x1="490" y1="330" x2="760" y2="330" stroke="#ef5350" stroke-width="3"/>
  <line x1="490" y1="235" x2="760" y2="235" stroke="#ff9d9d" stroke-width="2"/>
  <line x1="490" y1="155" x2="760" y2="155" stroke="#ef5350" stroke-width="2.5"/>
  <text x="620" y="130" fill="#ef7a7a" font-size="12" text-anchor="middle">斐波那契回撤（比例类）</text>
  <text x="620" y="150" fill="#8fa3c8" font-size="11" text-anchor="middle">38.2% / 50% / 61.8% 回撤位</text>
  <text x="760" y="325" fill="#ef7a7a" font-size="11">100%</text>
  <text x="760" y="150" fill="#ef7a7a" font-size="11">0%</text>

  <!-- arrow entrance -->
  <path d="M 520 120 L 500 155" stroke="#26a69a" stroke-width="2.5" fill="none" marker-end="url(#arrCL)"/>
  <text x="520" y="110" fill="#7ce0d0" font-size="12" text-anchor="middle">突破回踩入场</text>

  <!-- bottom note -->
  <text x="400" y="388" fill="#c8d3ea" font-size="13.5" text-anchor="middle">正确顺序：先有假设（这里是前高压力）→ 用线标出假设的关键位 → 等价格验证或证伪</text>
  <text x="400" y="412" fill="#ef7a7a" font-size="12.5" text-anchor="middle">⚠ 红线：绝大多数新手死于「先画线、后找理由」——线只是假设的投影，不是预言。</text>

  <defs><marker id="arrCL" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#26a69a"/></marker></defs>
</svg>