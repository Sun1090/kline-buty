<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgsm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgsm)" rx="16"/>
  <text x="400" y="32" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">微笑曲线 —— 附加值在两端，制造组装在谷底</text>

  <!-- axes -->
  <line x1="80" y1="70" x2="80" y2="330" stroke="#8fa3c8" stroke-width="2"/>
  <line x1="80" y1="330" x2="740" y2="330" stroke="#8fa3c8" stroke-width="2"/>
  <text x="45" y="210" fill="#8fa3c8" font-size="11" transform="rotate(-90 45 210)">附加值 ▲</text>
  <text x="740" y="350" fill="#8fa3c8" font-size="11" text-anchor="end">产业链环节 →</text>

  <!-- smile curve -->
  <path d="M 110 110 Q 220 130 400 300 Q 580 130 690 105" fill="none" stroke="#26a69a" stroke-width="3.5"/>

  <!-- labels -->
  <text x="130" y="95" fill="#7ce0d0" font-size="13" font-weight="700">研发设计/IP/芯片</text>
  <text x="130" y="112" fill="#8fa3c8" font-size="11">英伟达 GPU 毛利 60%+</text>
  <text x="640" y="86" fill="#7ce0d0" font-size="13" font-weight="700">品牌/渠道/零售</text>
  <text x="640" y="103" fill="#8fa3c8" font-size="11">茅台毛利率 90%</text>
  <text x="400" y="330" fill="#ef7a7a" font-size="13" font-weight="700" text-anchor="middle">中游：制造/组装/代工（谷底）</text>
  <text x="400" y="348" fill="#8fa3c8" font-size="11.5" text-anchor="middle">顶级代工净利率仅 3%-6% · 两头受挤（上游涨价、下游压价）</text>

  <!-- position markers -->
  <text x="240" y="345" fill="#8fa3c8" font-size="12" text-anchor="middle">上游</text>
  <text x="400" y="365" fill="#8fa3c8" font-size="12" text-anchor="middle">中游</text>
  <text x="560" y="345" fill="#8fa3c8" font-size="12" text-anchor="middle">下游</text>

  <!-- inversion note -->
  <rect x="140" y="376" width="520" height="34" rx="8" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="398" fill="#c8d3ea" font-size="12.5" text-anchor="middle">投资判断：越靠近「嘴角」（设计/品牌两端）护城河溢价越高；例外：制造端做出独特工艺壁垒也能离开谷底</text>
</svg>