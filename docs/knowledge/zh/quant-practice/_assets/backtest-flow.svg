<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgbf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="abf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4e9cf5"/>
    </marker>
    <marker id="abr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef5350"/>
    </marker>
  </defs>
  <rect width="800" height="440" fill="url(#bgbf)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">从回测到实盘 —— 每一步都在过滤幻觉</text>

  <!-- 主流水线 -->
  <rect x="40" y="80" width="128" height="76" rx="10" fill="#182238" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="104" y="110" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">① 读数据</text>
  <text x="104" y="130" fill="#8fa3c8" font-size="11" text-anchor="middle">清洗 / 复权</text>
  <text x="104" y="146" fill="#8fa3c8" font-size="11" text-anchor="middle">未来数据零容忍</text>

  <rect x="196" y="80" width="128" height="76" rx="10" fill="#182238" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="260" y="110" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">② 生成信号</text>
  <text x="260" y="130" fill="#8fa3c8" font-size="11" text-anchor="middle">规则明确可复现</text>
  <text x="260" y="146" fill="#8fa3c8" font-size="11" text-anchor="middle">不夹带主观判断</text>

  <rect x="352" y="80" width="128" height="76" rx="10" fill="#182238" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="416" y="110" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">③ 模拟成交</text>
  <text x="416" y="130" fill="#8fa3c8" font-size="11" text-anchor="middle">手续费 + 滑点</text>
  <text x="416" y="146" fill="#8fa3c8" font-size="11" text-anchor="middle">信号次日价成交</text>

  <rect x="508" y="80" width="128" height="76" rx="10" fill="#182238" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="572" y="110" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">④ 绩效指标</text>
  <text x="572" y="130" fill="#8fa3c8" font-size="11" text-anchor="middle">年化 / 回撤 / 夏普</text>
  <text x="572" y="146" fill="#8fa3c8" font-size="11" text-anchor="middle">收益回撤比体检</text>

  <rect x="664" y="80" width="108" height="76" rx="10" fill="#182238" stroke="#26a69a" stroke-width="1.5"/>
  <text x="718" y="110" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">⑤ 样本外</text>
  <text x="718" y="130" fill="#8fa3c8" font-size="11" text-anchor="middle">留出未碰过的</text>
  <text x="718" y="146" fill="#8fa3c8" font-size="11" text-anchor="middle">数据做终审</text>

  <line x1="168" y1="118" x2="192" y2="118" stroke="#4e9cf5" stroke-width="2.5" marker-end="url(#abf)"/>
  <line x1="324" y1="118" x2="348" y2="118" stroke="#4e9cf5" stroke-width="2.5" marker-end="url(#abf)"/>
  <line x1="480" y1="118" x2="504" y2="118" stroke="#4e9cf5" stroke-width="2.5" marker-end="url(#abf)"/>
  <line x1="636" y1="118" x2="660" y2="118" stroke="#4e9cf5" stroke-width="2.5" marker-end="url(#abf)"/>

  <!-- 第二排: 通过后 -->
  <path d="M 718 156 C 718 200 640 200 600 208" fill="none" stroke="#26a69a" stroke-width="2.5" marker-end="url(#abf)"/>
  <rect x="460" y="212" width="140" height="66" rx="10" fill="#182238" stroke="#26a69a" stroke-width="1.5"/>
  <text x="530" y="238" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">⑥ 模拟盘 / 小实盘</text>
  <text x="530" y="258" fill="#8fa3c8" font-size="11" text-anchor="middle">真实滑点与心态入场</text>

  <line x1="458" y1="245" x2="386" y2="245" stroke="#26a69a" stroke-width="2.5" marker-end="url(#abf)"/>
  <rect x="250" y="212" width="136" height="66" rx="10" fill="#182238" stroke="#26a69a" stroke-width="1.5"/>
  <text x="318" y="238" fill="#eef2ff" font-size="13.5" font-weight="700" text-anchor="middle">⑦ 实盘监控</text>
  <text x="318" y="258" fill="#8fa3c8" font-size="11" text-anchor="middle">策略失效即停</text>

  <!-- 修正回路 -->
  <path d="M 250 245 C 150 245 104 220 104 160" fill="none" stroke="#e8b56e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#abf)"/>
  <text x="150" y="196" fill="#e8b56e" font-size="11.5">不达标 → 修改规则重来</text>

  <!-- 过拟合警告 -->
  <rect x="40" y="308" width="720" height="86" rx="12" fill="#2a1620" stroke="#ef5350" stroke-width="1.5"/>
  <text x="400" y="338" fill="#ef5350" font-size="14.5" font-weight="700" text-anchor="middle">⚠ 过滤掉的幻觉比跑出来的收益更重要</text>
  <text x="400" y="362" fill="#c8d3ea" font-size="12.5" text-anchor="middle">参数越调越好看 = 过拟合；回测赚钱 ≠ 实盘赚钱——样本内满分、样本外及格才是及格</text>
  <text x="400" y="382" fill="#8fa3c8" font-size="12" text-anchor="middle">没有记录的结论等于没做过：每次改动都要留版本与理由</text>
</svg>
