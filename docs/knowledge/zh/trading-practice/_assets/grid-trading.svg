<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bggrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bggrid)" rx="16"/>
  <text x="400" y="32" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">网格交易 —— 每跌一格买，每涨一格卖（赚「来回」不赚「方向」）</text>

  <!-- grid box -->
  <rect x="90" y="80" width="330" height="290" fill="rgba(41,98,255,0.05)" stroke="#4e9cf5" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="255" y="72" fill="#4e9cf5" font-size="13" text-anchor="middle">区间 [L, H] 均分 N 格</text>

  <!-- grid lines horizontal -->
  <line x1="90" y1="80"  x2="420" y2="80"  stroke="#8fa3c8" stroke-width="1.5"/>
  <line x1="90" y1="138" x2="420" y2="138" stroke="#8fa3c8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="196" x2="420" y2="196" stroke="#8fa3c8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="254" x2="420" y2="254" stroke="#8fa3c8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="312" x2="420" y2="312" stroke="#8fa3c8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="90" y1="370" x2="420" y2="370" stroke="#8fa3c8" stroke-width="1.5"/>

  <!-- price oscillating -->
  <path d="M 90 80 C 140 130 170 240 210 254 S 280 150 320 196 S 370 300 420 138" fill="none" stroke="#fff" stroke-width="2.2" opacity="0.75"/>

  <!-- level labels -->
  <text x="428" y="86" fill="#7ce0d0" font-size="12">H 上界（卖出越涨越多）</text>
  <text x="428" y="318" fill="#ef7a7a" font-size="12">L 下界（买入越跌越多）</text>

  <!-- buy/sell tags -->
  <text x="130" y="168" fill="#26a69a" font-size="12">买一份↓</text>
  <text x="300" y="230" fill="#ef5350" font-size="12">卖一份↑</text>

  <!-- arrows -->
  <line x1="120" y1="120" x2="120" y2="156" stroke="#26a69a" stroke-width="2" marker-end="url(#arrGrid)"/>
  <line x1="330" y1="220" x2="330" y2="184" stroke="#ef5350" stroke-width="2" marker-end="url(#arrGrid2)"/>

  <!-- right panel: three scenarios -->
  <rect x="470" y="80" width="290" height="80" rx="12" fill="#11352c" stroke="#26a69a" stroke-width="1.8"/>
  <text x="615" y="104" fill="#7ce0d0" font-size="13.5" font-weight="700" text-anchor="middle">区间震荡 ✅</text>
  <text x="615" y="126" fill="#8fa3c8" font-size="12" text-anchor="middle">价格来回 → 每对格子赚价差</text>
  <text x="615" y="145" fill="#8fa3c8" font-size="11.5" text-anchor="middle">震荡次数越多越赚</text>

  <rect x="470" y="172" width="290" height="80" rx="12" fill="#31281a" stroke="#f5a623" stroke-width="1.8"/>
  <text x="615" y="196" fill="#ffd9a0" font-size="13.5" font-weight="700" text-anchor="middle">单边上涨 ⚠️</text>
  <text x="615" y="218" fill="#8fa3c8" font-size="12" text-anchor="middle">连卖不买 → 冲高区全部空仓</text>
  <text x="615" y="237" fill="#8fa3c8" font-size="11.5" text-anchor="middle">只赚底部一小段，之后看戏</text>

  <rect x="470" y="264" width="290" height="80" rx="12" fill="#3d2020" stroke="#ef5350" stroke-width="1.8"/>
  <text x="615" y="288" fill="#ff9d9d" font-size="13.5" font-weight="700" text-anchor="middle">单边下跌 💀</text>
  <text x="615" y="310" fill="#8fa3c8" font-size="12" text-anchor="middle">连买不卖 → 打光资金满仓</text>
  <text x="615" y="329" fill="#8fa3c8" font-size="11.5" text-anchor="middle">浮亏随下跌不断放大</text>

  <text x="400" y="410" fill="#c8d3ea" font-size="13.5" text-anchor="middle">一句话：网格赚「来回次数」的钱，亏「只去不回」的钱 —— 本质是<text x="400" y="410" fill="#ef7a7a" font-weight="700">做空波动率</text></text>

  <defs>
    <marker id="arrGrid" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#26a69a"/></marker>
    <marker id="arrGrid2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef5350"/></marker>
  </defs>
</svg>