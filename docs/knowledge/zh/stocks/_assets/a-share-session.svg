<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="arrASH" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8fa3c8"/></marker>
  </defs>
  <rect width="800" height="380" fill="url(#bgash)" rx="16"/>
  <text x="400" y="32" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">A 股一日交易时间线 —— 北京时间的「红绿灯」</text>

  <!-- time axis -->
  <line x1="60" y1="180" x2="740" y2="180" stroke="#8fa3c8" stroke-width="2.5" marker-end="url(#arrASH)"/>
  <text x="755" y="184" fill="#8fa3c8" font-size="12">时间</text>
  <!-- hour ticks -->
  <text x="125" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">9:15</text>
  <text x="215" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">9:25</text>
  <text x="300" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">11:30</text>
  <text x="420" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">13:00</text>
  <text x="545" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">14:57</text>
  <text x="590" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">15:00</text>
  <text x="675" y="200" fill="#5f6f95" font-size="11" text-anchor="middle">15:30</text>

  <!-- blocks -->
  <!-- 9:15-9:25 auction -->
  <rect x="95" y="110" width="150" height="52" rx="9" fill="#31281a" stroke="#f5a623" stroke-width="2"/>
  <text x="170" y="132" fill="#ffd9a0" font-size="12.5" font-weight="700" text-anchor="middle">集合竞价</text>
  <text x="170" y="151" fill="#8fa3c8" font-size="11" text-anchor="middle">9:20 前可撤单</text>

  <rect x="245" y="110" width="55" height="52" rx="9" fill="#3d2020" stroke="#ef5350" stroke-width="1.8"/>
  <text x="272" y="131" fill="#ff9d9d" font-size="11" font-weight="700" text-anchor="middle">静默</text>
  <text x="272" y="150" fill="#8fa3c8" font-size="10.5" text-anchor="middle">不可撤</text>

  <!-- continuous am -->
  <rect x="300" y="110" width="150" height="52" rx="9" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="375" y="132" fill="#7ce0d0" font-size="12.5" font-weight="700" text-anchor="middle">连续竞价 · 上午</text>
  <text x="375" y="151" fill="#8fa3c8" font-size="11" text-anchor="middle">价格/时间优先撮合</text>

  <!-- lunch -->
  <rect x="450" y="110" width="90" height="52" rx="9" fill="rgba(128,140,180,0.12)" stroke="#8fa3c8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="495" y="132" fill="#8fa3c8" font-size="11.5" text-anchor="middle">午间休市</text>
  <text x="495" y="151" fill="#8fa3c8" font-size="10.5" text-anchor="middle">可挂单</text>

  <!-- continuous pm -->
  <rect x="540" y="110" width="90" height="52" rx="9" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="585" y="132" fill="#7ce0d0" font-size="11.5" font-weight="700" text-anchor="middle">连续竞价·下午</text>
  <text x="585" y="151" fill="#8fa3c8" font-size="10" text-anchor="middle">至 14:57</text>

  <!-- close auction -->
  <rect x="630" y="110" width="90" height="52" rx="9" fill="#31281a" stroke="#f5a623" stroke-width="2"/>
  <text x="675" y="128" fill="#ffd9a0" font-size="11.5" font-weight="700" text-anchor="middle">收盘集合竞价</text>
  <text x="675" y="146" fill="#ef7a7a" font-size="10.5" text-anchor="middle">14:57-15:00</text>
  <text x="675" y="160" fill="#8fa3c8" font-size="10" text-anchor="middle">不可撤单</text>

  <!-- sci-tech after-hours -->
  <rect x="720" y="110" width="70" height="52" rx="9" fill="rgba(139,92,246,0.15)" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="755" y="132" fill="#a78bfa" font-size="10.5" font-weight="700" text-anchor="middle">科创盘后</text>
  <text x="755" y="150" fill="#8fa3c8" font-size="10" text-anchor="middle">15:05-30</text>

  <!-- red flags -->
  <text x="400" y="248" fill="#ef7a7a" font-size="13" font-weight="700" text-anchor="middle">⚠ 想撤单必须在 14:57 前完成 —— 收盘集合竞价期间不可撤单</text>
  <text x="400" y="278" fill="#8fa3c8" font-size="12.5" text-anchor="middle">周末、法定节假日、交易所临时休市日均不交易；沪市与深市时段基本一致。</text>
  <text x="400" y="310" fill="#a7c8ff" font-size="12" text-anchor="middle">竞价规则：买价高者先 · 卖价低者先 · 同价先申报先成交；集合竞价成交价 = 使成交量最大的价格。</text>
  <text x="400" y="346" fill="#5f6f95" font-size="11.5" text-anchor="middle">Kline Buty 知识库 · 交易时间全景见 01-入门基础/04</text>
</svg>