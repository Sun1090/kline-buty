<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgm2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bgm2)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">MACD —— 快线 / 慢线 / 能量柱：买在柱变红，卖在柱变绿</text>

  <!-- zero line -->
  <line x1="60" y1="250" x2="740" y2="250" stroke="#3d4a6b" stroke-width="2"/>
  <text x="740" y="240" fill="#8fa3c8" font-size="12">0 轴（零轴）</text>

  <!-- DIF line (fast) -->
  <path d="M 60 200 C 140 220 220 240 300 250 S 460 300 540 290 S 700 210 740 190" fill="none" stroke="#4e9cf5" stroke-width="2.8"/>
  <text x="80" y="188" fill="#4e9cf5" font-size="12" font-weight="700">DIF = EMA(12) − EMA(26)</text>

  <!-- DEA line (slow) -->
  <path d="M 60 215 C 120 230 200 245 300 252 S 460 285 540 280 S 700 235 740 225" fill="none" stroke="#e8b56e" stroke-width="2.5"/>
  <text x="600" y="165" fill="#e8b56e" font-size="12" font-weight="700">DEA = EMA(9, DIF)</text>

  <!-- histogram bars -->
  <rect x="80" y="252" width="26" height="26" fill="#ef5350"/>
  <rect x="140" y="258" width="26" height="20" fill="#ef5350"/>
  <rect x="200" y="268" width="26" height="10" fill="#ef5350"/>
  <rect x="260" y="246" width="26" height="34" fill="#ef5350"/>
  <rect x="320" y="238" width="26" height="44" fill="#26a69a"/>
  <rect x="380" y="232" width="26" height="58" fill="#26a69a"/>
  <rect x="440" y="252" width="26" height="28" fill="#26a69a"/>
  <rect x="500" y="266" width="26" height="8" fill="#ef5350"/>
  <rect x="560" y="258" width="26" height="22" fill="#ef5350"/>
  <rect x="620" y="246" width="26" height="36" fill="#ef5350"/>
  <rect x="680" y="232" width="26" height="52" fill="#ef5350"/>

  <text x="110" y="350" fill="#ef7a7a" font-size="13">柱翻绿（DIF&lt;DEA）→ 动能转弱</text>
  <text x="400" y="350" fill="#7ce0d0" font-size="13">柱翻红（DIF&gt;DEA）→ 动能转强</text>
  <text x="400" y="386" fill="#c8d3ea" font-size="13" text-anchor="middle">金叉（DIF 上穿 DEA，0 轴上方更可靠）→ 偏多；死叉（DIF 下穿 DEA）→ 偏空</text>
  <text x="400" y="412" fill="#8fa3c8" font-size="12" text-anchor="middle">⚠ 与所有动量指标一样：强趋势里会连续钝化/背离，务必先看大周期方向。</text>
</svg>