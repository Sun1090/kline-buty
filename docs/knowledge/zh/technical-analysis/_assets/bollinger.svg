<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(78,156,245,0.16)"/><stop offset="1" stop-color="rgba(38,166,154,0.16)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bgb)" rx="16"/>
  <text x="400" y="36" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">布林带（BOLL）—— 三层运行区间：收口 ⇄ 开口</text>

  <!-- band between upper and lower -->
  <path d="M 60 170 C 180 170 220 120 320 120 S 520 200 620 200 S 740 180 760 170" fill="none" stroke="#4e9cf5" stroke-width="2.5"/>
  <path d="M 60 280 C 180 280 220 300 320 300 S 520 250 620 250 S 740 260 760 265" fill="none" stroke="#26a69a" stroke-width="2.5"/>
  <!-- fill between -->
  <path d="M 760 170 C 740 180 660 200 620 200 S 420 200 320 120 S 180 120 60 170" fill="none"/>
  <text x="60" y="160" fill="#4e9cf5" font-size="12">上轨 UP = MA(20) + 2×SD</text>
  <text x="60" y="300" fill="#26a69a" font-size="12">下轨 LO = MA(20) − 2×SD</text>

  <!-- middle MA -->
  <path d="M 60 225 C 180 225 220 210 320 210 S 520 225 620 225 S 740 220 760 218" fill="none" stroke="#e8b56e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="240" fill="#e8b56e" font-size="12">中轨 = MA(20)</text>

  <!-- price wiggling inside -->
  <path d="M 60 260 C 120 220 140 190 180 200 S 240 300 300 250 S 420 150 480 190 S 560 260 620 200 S 700 210 760 185" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.55"/>

  <!-- annotations -->
  <text x="330" y="95" fill="#7ce0d0" font-size="13">收口（带子极窄）</text>
  <text x="330" y="113" fill="#8fa3c8" font-size="12">波动压缩 → 变盘临近</text>
  <line x1="380" y1="120" x2="380" y2="145" stroke="#7ce0d0" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="560" y="88" fill="#ef7a7a" font-size="13">开口（带子变宽）</text>
  <text x="560" y="104" fill="#8fa3c8" font-size="12">波动加大 → 行情启动</text>

  <text x="620" y="355" fill="#ff9d9d" font-size="13">触上轨 ⚠ 强势趋势可贴轨运行，别急着反手</text>
  <text x="140" y="352" fill="#7ce0d0" font-size="13">跌破下轨 → 超卖，倾向回归中轨</text>

  <text x="400" y="396" fill="#8fa3c8" font-size="12.5" text-anchor="middle">上下轨是统计边界（95% 波动区间），不是买卖信号；收口后变盘方向未知，需其他指标定方向。</text>
</svg>