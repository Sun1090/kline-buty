<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="-apple-system, sans-serif">
  <rect width="720" height="300" fill="#1a1a2e"/>
  <text x="360" y="26" text-anchor="middle" fill="#e0e0e0" font-size="15" font-weight="bold">不同杠杆倍数下的爆仓距离（做多）</text>

  <!-- Bars -->
  <!-- 2x: -49.5% -->
  <rect x="80" y="50" width="495" height="28" rx="4" fill="#4caf87" opacity="0.8"/>
  <text x="90" y="69" fill="#fff" font-size="12">2x</text>
  <text x="585" y="69" fill="#4caf87" font-size="13" font-weight="bold">-49.5%</text>

  <!-- 5x: -19.5% -->
  <rect x="80" y="88" width="195" height="28" rx="4" fill="#64b3f4" opacity="0.8"/>
  <text x="90" y="107" fill="#fff" font-size="12">5x</text>
  <text x="285" y="107" fill="#64b3f4" font-size="13" font-weight="bold">-19.5%</text>

  <!-- 10x: -9.5% -->
  <rect x="80" y="126" width="95" height="28" rx="4" fill="#ffd166" opacity="0.8"/>
  <text x="90" y="145" fill="#fff" font-size="12">10x</text>
  <text x="185" y="145" fill="#ffd166" font-size="13" font-weight="bold">-9.5%</text>

  <!-- 20x: -4.5% -->
  <rect x="80" y="164" width="45" height="28" rx="4" fill="#ff9f43" opacity="0.8"/>
  <text x="90" y="183" fill="#fff" font-size="11">20x</text>
  <text x="135" y="183" fill="#ff9f43" font-size="13" font-weight="bold">-4.5%</text>

  <!-- 50x: -1.5% -->
  <rect x="80" y="202" width="15" height="28" rx="2" fill="#ef4565" opacity="0.9"/>
  <text x="105" y="221" fill="#ef4565" font-size="13" font-weight="bold">50x → -1.5%</text>

  <!-- 100x: -0.5% -->
  <rect x="80" y="240" width="5" height="28" rx="1" fill="#ef4565"/>
  <text x="95" y="259" fill="#ef4565" font-size="13" font-weight="bold">100x → -0.5%</text>

  <!-- BTC daily vol reference line at ~3% -->
  <line x1="110" y1="42" x2="110" y2="275" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="118" y="52" fill="#c084fc" font-size="11">BTC 日均波动 ≈ 3%</text>

  <text x="360" y="290" text-anchor="middle" fill="#666" font-size="11">入场价 100,000 · 维持保证金率 0.5%</text>
</svg>
