<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8fa3c8"/></marker>
  </defs>
  <rect width="800" height="420" fill="url(#bgf)" rx="16"/>
  <text x="400" y="36" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">资金费率 —— 永续合约的「价格拉力」，期货价回归现货价</text>

  <!-- left: positive funding -->
  <rect x="40" y="80" width="345" height="230" rx="12" fill="#12203a" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="212" y="108" fill="#7ce0d0" font-size="14" font-weight="700" text-anchor="middle">正费率（合约价 &gt; 现货价）</text>
  <rect x="60" y="130" width="130" height="52" rx="8" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
  <text x="125" y="153" fill="#ffd3d3" font-size="13" text-anchor="middle">合约 100.2</text>
  <text x="125" y="171" fill="#8fa3c8" font-size="11" text-anchor="middle">（买贵了）</text>
  <rect x="235" y="130" width="130" height="52" rx="8" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="300" y="153" fill="#a7efe5" font-size="13" text-anchor="middle">现货 100.0</text>
  <text x="300" y="171" fill="#8fa3c8" font-size="11" text-anchor="middle">（基准）</text>
  <path d="M 190 156 L 230 156" stroke="#ff9d9d" stroke-width="2.5" marker-end="url(#arrF)"/>
  <text x="212" y="205" fill="#ffd3d3" font-size="13" text-anchor="middle" font-weight="700">多头（买贵方）→ 按费率付钱给空头</text>
  <text x="212" y="228" fill="#8fa3c8" font-size="12" text-anchor="middle">费率越高，多头持仓成本越高 → 逼多头平仓降温</text>
  <text x="212" y="285" fill="#5f6f95" font-size="12" text-anchor="middle">常见：牛市加速段费率飙到 0.1%~1%+/8h</text>

  <!-- right: negative funding -->
  <rect x="420" y="80" width="345" height="230" rx="12" fill="#12203a" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="592" y="108" fill="#ef7a7a" font-size="14" font-weight="700" text-anchor="middle">负费率（合约价 &lt; 现货价）</text>
  <rect x="440" y="130" width="130" height="52" rx="8" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
  <text x="505" y="153" fill="#ffd3d3" font-size="13" text-anchor="middle">合约 99.8</text>
  <text x="505" y="171" fill="#8fa3c8" font-size="11" text-anchor="middle">（卖便宜了）</text>
  <rect x="615" y="130" width="130" height="52" rx="8" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="680" y="153" fill="#a7efe5" font-size="13" text-anchor="middle">现货 100.0</text>
  <text x="680" y="171" fill="#8fa3c8" font-size="11" text-anchor="middle">（基准）</text>
  <path d="M 570 156 L 610 156" stroke="#7ce0d0" stroke-width="2.5" marker-end="url(#arrF)"/>
  <text x="592" y="205" fill="#ffd3d3" font-size="13" text-anchor="middle" font-weight="700">空头（卖便宜方）→ 按费率付钱给多头</text>
  <text x="592" y="228" fill="#8fa3c8" font-size="12" text-anchor="middle">费率越低（负），空头持仓成本越高 → 逼空头回补</text>
  <text x="592" y="285" fill="#5f6f95" font-size="12" text-anchor="middle">熊市砸盘或极端看空时出现负费率</text>

  <!-- bottom -->
  <rect x="40" y="330" width="725" height="52" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="355" fill="#c8d3ea" font-size="13.5" text-anchor="middle">结算：每 8 小时一次（UTC 00/08/16 → 北京 08/16/00）。资金费在多空之间转移，交易所只收手续费。</text>
  <text x="400" y="376" fill="#8fa3c8" font-size="12.5" text-anchor="middle">💡 情绪指标：超高正费率 = 市场过度看多（警惕见顶）；深度负费率 = 极度看空（警惕轧空反弹）。</text>
</svg>