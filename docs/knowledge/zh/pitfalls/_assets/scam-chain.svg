<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgsc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="arrSC" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ef5350"/></marker>
  </defs>
  <rect width="800" height="300" fill="url(#bgsc)" rx="16"/>
  <text x="400" y="36" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">所有金融骗局的共同骨架 —— 六步收割链</text>

  <g font-size="12.5" font-weight="700">
    <!-- 6 steps -->
    <rect x="30"  y="80" width="112" height="78" rx="10" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
    <text x="86" y="105" fill="#ff9d9d" text-anchor="middle">① 制造焦虑</text>
    <text x="86" y="125" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">免费课/内幕</text>
    <text x="86" y="143" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">「稳稳赚钱」</text>

    <rect x="158" y="80" width="112" height="78" rx="10" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
    <text x="214" y="105" fill="#ff9d9d" text-anchor="middle">② 建立信任</text>
    <text x="214" y="125" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">晒盈利截图</text>
    <text x="214" y="143" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">群托捧场</text>

    <rect x="286" y="80" width="112" height="78" rx="10" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
    <text x="342" y="105" fill="#ff9d9d" text-anchor="middle">③ 尝到甜头</text>
    <text x="342" y="125" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">前几单真赚钱</text>
    <text x="342" y="143" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">允许小额提现</text>

    <rect x="414" y="80" width="112" height="78" rx="10" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
    <text x="470" y="105" fill="#ff9d9d" text-anchor="middle">④ 诱导加码</text>
    <text x="470" y="125" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">充值VIP/加大仓</text>
    <text x="470" y="143" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">拉人头</text>

    <rect x="542" y="80" width="112" height="78" rx="10" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
    <text x="598" y="105" fill="#ff9d9d" text-anchor="middle">⑤ 收网收割</text>
    <text x="598" y="125" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">行情暴跌/跑路</text>
    <text x="598" y="143" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">限制提现</text>

    <rect x="670" y="80" width="112" height="78" rx="10" fill="#1a1d2e" stroke="#8fa3c8" stroke-width="1.8"/>
    <text x="726" y="105" fill="#c8d3ea" text-anchor="middle">⑥ 失联</text>
    <text x="726" y="125" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">解散/拉黑</text>
    <text x="726" y="143" fill="#8fa3c8" font-size="11" font-weight="400" text-anchor="middle">换个马甲再来</text>
  </g>

  <!-- arrows -->
  <line x1="142" y1="119" x2="154" y2="119" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arrSC)"/>
  <line x1="270" y1="119" x2="282" y2="119" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arrSC)"/>
  <line x1="398" y1="119" x2="410" y2="119" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arrSC)"/>
  <line x1="526" y1="119" x2="538" y2="119" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arrSC)"/>
  <line x1="654" y1="119" x2="666" y2="119" stroke="#ef5350" stroke-width="2.5" marker-end="url(#arrSC)"/>

  <!-- key reminder -->
  <rect x="120" y="196" width="560" height="62" rx="12" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
  <text x="400" y="222" fill="#ff9d9d" font-size="15" font-weight="700" text-anchor="middle">⚠️ 你能看到的「盈利截图」和「群友」，都是骗局的道具</text>
  <text x="400" y="246" fill="#c8d3ea" font-size="13" text-anchor="middle">而不是证据。先展示收益 → 再诱导投入 → 最后收割跑路。</text>
</svg>