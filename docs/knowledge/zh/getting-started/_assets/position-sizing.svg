<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="-apple-system, sans-serif">
  <rect width="640" height="380" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold">金字塔加仓 vs 倒金字塔加仓</text>

  <!-- Left: correct pyramid -->
  <text x="160" y="60" text-anchor="middle" fill="#4caf87" font-size="14" font-weight="bold">✓ 正金字塔（正确）</text>

  <polygon points="80,80 240,80 220,110 100,110" fill="#4caf8733" stroke="#4caf87" stroke-width="1.5"/>
  <text x="160" y="100" text-anchor="middle" fill="#4caf87" font-size="12">初始仓 30%</text>

  <polygon points="100,120 220,120 205,150 115,150" fill="#4caf8722" stroke="#4caf87" stroke-width="1.5"/>
  <text x="160" y="140" text-anchor="middle" fill="#8892b0" font-size="12">+20%</text>

  <polygon points="115,160 205,160 195,190 125,190" fill="#4caf8715" stroke="#4caf87" stroke-width="1.5"/>
  <text x="160" y="180" text-anchor="middle" fill="#8892b0" font-size="12">+10%</text>

  <polygon points="125,200 195,200 188,225 132,225" fill="#4caf8710" stroke="#4caf87" stroke-width="1.5"/>
  <text x="160" y="217" text-anchor="middle" fill="#8892b0" font-size="11">+5%</text>

  <line x1="70" y1="235" x2="250" y2="235" stroke="#64ffda" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="255" text-anchor="middle" fill="#64ffda" font-size="13">价格上涨 →</text>
  <text x="160" y="280" text-anchor="middle" fill="#8892b0" font-size="12">底部重、顶部轻</text>
  <text x="160" y="298" text-anchor="middle" fill="#8892b0" font-size="12">平均成本始终低于现价</text>

  <!-- Right: inverted pyramid (wrong) -->
  <text x="480" y="60" text-anchor="middle" fill="#ef4565" font-size="14" font-weight="bold">✗ 倒金字塔（危险）</text>

  <polygon points="420,80 540,80 547,105 413,105" fill="#ef456515" stroke="#ef4565" stroke-width="1.5"/>
  <text x="480" y="97" text-anchor="middle" fill="#8892b0" font-size="11">初始仓 10%</text>

  <polygon points="413,115 547,115 553,145 407,145" fill="#ef456522" stroke="#ef4565" stroke-width="1.5"/>
  <text x="480" y="135" text-anchor="middle" fill="#8892b0" font-size="12">+20%（亏损后加仓）</text>

  <polygon points="407,155 553,155 560,190 400,190" fill="#ef456533" stroke="#ef4565" stroke-width="1.5"/>
  <text x="480" y="177" text-anchor="middle" fill="#ef4565" font-size="12">+30%（继续亏继续加）</text>

  <polygon points="400,200 560,200 568,245 392,245" fill="#ef456544" stroke="#ef4565" stroke-width="2"/>
  <text x="480" y="228" text-anchor="middle" fill="#ef4565" font-size="13" font-weight="bold">+40%（越亏越重）</text>

  <line x1="390" y1="255" x2="570" y2="255" stroke="#ef4565" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="480" y="275" text-anchor="middle" fill="#ef4565" font-size="13">价格下跌 → 亏损加速</text>
  <text x="480" y="300" text-anchor="middle" fill="#8892b0" font-size="12">顶部重、底部轻</text>
  <text x="480" y="318" text-anchor="middle" fill="#ef4565" font-size="12">一次深跌即爆仓</text>

  <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#64ffda"/>
  </marker>
</svg>
