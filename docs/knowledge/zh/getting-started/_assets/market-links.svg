<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgml2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="430" fill="url(#bgml2)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">市场之间的联动 —— 金融市场不是孤岛，钱在全球流动</text>

  <!-- 4 link groups -->
  <!-- 7.1 美股 ↔ 加密 -->
  <rect x="40" y="70" width="350" height="120" rx="12" fill="#12203a" stroke="#4e9cf5" stroke-width="1.8"/>
  <text x="215" y="94" fill="#a7c8ff" font-size="13.5" font-weight="700" text-anchor="middle">① 美股 ↔ 加密</text>
  <text x="215" y="118" fill="#c8d3ea" font-size="12" text-anchor="middle">美联储加息/降息预期 → 两者同涨同跌</text>
  <text x="215" y="140" fill="#8fa3c8" font-size="11.5" text-anchor="middle">纳指 与 BTC 相关系数多数年份为正</text>
  <text x="215" y="176" fill="#8fa3c8" font-size="11" text-anchor="middle">美股开盘时段加密波动加大（美机构资金活跃）</text>

  <!-- 7.2 美元 ↔ 商品/加密 -->
  <rect x="410" y="70" width="350" height="120" rx="12" fill="#3d2c1a" stroke="#f5a623" stroke-width="1.8"/>
  <text x="585" y="94" fill="#ffd9a0" font-size="13.5" font-weight="700" text-anchor="middle">② 美元指数 DXY ↔ 商品/加密</text>
  <text x="585" y="118" fill="#c8d3ea" font-size="12" text-anchor="middle">黄金/原油/铜以美元计价</text>
  <text x="585" y="140" fill="#8fa3c8" font-size="11.5" text-anchor="middle">美元走强 → 商品价格承压</text>
  <text x="585" y="176" fill="#8fa3c8" font-size="11" text-anchor="middle">落在「美元流动性收紧/放松」的宏观逻辑上</text>

  <!-- 7.3 黄金 ↔ 风险资产 -->
  <rect x="40" y="210" width="350" height="120" rx="12" fill="#11352c" stroke="#26a69a" stroke-width="1.8"/>
  <text x="215" y="234" fill="#7ce0d0" font-size="13.5" font-weight="700" text-anchor="middle">③ 黄金 ↔ 风险资产</text>
  <text x="215" y="258" fill="#c8d3ea" font-size="12" text-anchor="middle">股市暴跌/地缘冲突 → 资金涌入黄金</text>
  <text x="215" y="292" fill="#7ce0d0" font-size="11.5" text-anchor="middle">美股涨 + 黄金跌 = 风险偏好高；反之 = 避险</text>

  <!-- 7.4 原油 ↔ 通胀/股市 -->
  <rect x="410" y="210" width="350" height="120" rx="12" fill="#3d2020" stroke="#ef5350" stroke-width="1.8"/>
  <text x="585" y="234" fill="#ff9d9d" font-size="13.5" font-weight="700" text-anchor="middle">④ 原油 ↔ 通胀/股市</text>
  <text x="585" y="258" fill="#c8d3ea" font-size="12" text-anchor="middle">油价大涨 → 通胀预期升 → 央行加息 → 压制股市</text>
  <text x="585" y="292" fill="#ff9d9d" font-size="11.5" text-anchor="middle">2022 俄乌推高原油、全球股市承压 = 典型案例</text>

  <!-- bottom -->
  <rect x="90" y="352" width="620" height="50" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="374" fill="#c8d3ea" font-size="13" text-anchor="middle">观察「风险偏好」的一个简单指标：<text x="400" y="374" fill="#7ce0d0" font-weight="700">美股涨 + 黄金跌 = 风险偏好高</text></text>
  <text x="400" y="394" fill="#8fa3c8" font-size="12" text-anchor="middle">钱在全球市场之间流动，多家互认的「联动」是理解市场情绪的地图</text>
</svg>