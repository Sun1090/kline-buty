<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bgeg)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">预期差 —— 数据解读的第一课：价格只对「实际 ≠ 预期」反应</text>

  <!-- expected line -->
  <line x1="150" y1="160" x2="650" y2="160" stroke="#8fa3c8" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="655" y="152" fill="#8fa3c8" font-size="12">市场预期 CPI = 3.0%</text>

  <!-- scenario A: on target -->
  <circle cx="300" cy="160" r="12" fill="#12203a" stroke="#8fa3c8" stroke-width="2"/>
  <text x="300" y="165" fill="#c8d3ea" font-size="11" text-anchor="middle">A</text>
  <text x="300" y="200" fill="#8fa3c8" font-size="12" text-anchor="middle">3.0% 符合预期</text>
  <text x="300" y="220" fill="#8fa3c8" font-size="11" text-anchor="middle">无新信息 → 平淡</text>

  <!-- scenario B: below -->
  <circle cx="120" cy="160" r="12" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="120" y="165" fill="#7ce0d0" font-size="11" text-anchor="middle">B</text>
  <text x="160" y="140" fill="#8fa3c8" font-size="11">实际 2.8%</text>
  <line x1="132" y1="160" x2="285" y2="160" stroke="#26a69a" stroke-width="2" marker-end="url(#arrEG)"/>
  <text x="120" y="230" fill="#7ce0d0" font-size="12" font-weight="700" text-anchor="middle">低于预期</text>
  <text x="120" y="250" fill="#8fa3c8" font-size="11" text-anchor="middle">降息升温 → 利多 🟢</text>

  <!-- scenario C: above -->
  <circle cx="560" cy="160" r="12" fill="#3d2020" stroke="#ef5350" stroke-width="2"/>
  <text x="560" y="165" fill="#ff9d9d" font-size="11" text-anchor="middle">C</text>
  <text x="620" y="140" fill="#8fa3c8" font-size="11">实际 3.2%</text>
  <line x1="480" y1="160" x2="572" y2="160" stroke="#ef5350" stroke-width="2" marker-end="url(#arrEG2)"/>
  <text x="620" y="230" fill="#ff9d9d" font-size="12" font-weight="700" text-anchor="middle">高于预期</text>
  <text x="620" y="250" fill="#8fa3c8" font-size="11" text-anchor="middle">降息推迟 → 利空 🔴</text>

  <!-- key conclusion -->
  <rect x="110" y="290" width="580" height="60" rx="12" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="316" fill="#c8d3ea" font-size="13.5" font-weight="700" text-anchor="middle">3.2% 本身不算高，但它是「超预期」→ 市场按利空定价</text>
  <text x="400" y="340" fill="#ff9d9d" font-size="12.5" text-anchor="middle">利好利空 ≠ 数字高低的函数，而是「实际 vs 预期」的差值的函数</text>

  <text x="400" y="386" fill="#8fa3c8" font-size="12.5" text-anchor="middle">新手盯数据追进去，数据符合预期 → 价格纹丝不动：因为他交易的是「数字」，不是「预期差」。</text>

  <defs>
    <marker id="arrEG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#26a69a"/></marker>
    <marker id="arrEG2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ef5350"/></marker>
  </defs>
</svg>