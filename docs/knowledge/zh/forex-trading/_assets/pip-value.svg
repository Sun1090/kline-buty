<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgpip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="430" fill="url(#bgpip)" rx="16"/>
  <text x="400" y="32" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">外汇点值 —— 1 标准手 EUR/USD 的 1 点 = 10 美元（请记死）</text>

  <!-- EUR/USD quote -->
  <rect x="60" y="70" width="330" height="86" rx="12" fill="#12203a" stroke="#4e9cf5" stroke-width="2"/>
  <text x="225" y="94" fill="#a7c8ff" font-size="14" font-weight="700" text-anchor="middle">EUR/USD = 1.0850</text>
  <text x="225" y="118" fill="#c8d3ea" font-size="13" text-anchor="middle">买入 1 标准手（100,000 欧元）</text>
  <text x="225" y="140" fill="#8fa3c8" font-size="12" text-anchor="middle">1 Pip = 0.0001（第 4 位小数）</text>

  <!-- calc chain -->
  <text x="400" y="118" fill="#4e9cf5" font-size="28" font-weight="700" text-anchor="middle">→→</text>

  <rect x="440" y="70" width="300" height="86" rx="12" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="590" y="94" fill="#7ce0d0" font-size="14" font-weight="700" text-anchor="middle">每点价值 = 100,000 × 0.0001</text>
  <text x="590" y="118" fill="#c8d3ea" font-size="20" font-weight="700" text-anchor="middle">= 10 USD / 点</text>
  <text x="590" y="140" fill="#8fa3c8" font-size="12" text-anchor="middle">这是外汇交易员最熟的数字</text>

  <!-- worked example -->
  <rect x="60" y="180" width="680" height="96" rx="12" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="206" fill="#c8d3ea" font-size="14" font-weight="700" text-anchor="middle">推演：价格从 1.0850 涨到 1.0900</text>
  <text x="150" y="234" fill="#aab8d6" font-size="13">涨幅 = 0.0050 = <text x="195" y="234" fill="#7ce0d0" font-weight="700">50 点</text></text>
  <text x="430" y="234" fill="#aab8d6" font-size="13">盈亏 = 50 点 × 10 美元 = <text x="570" y="234" fill="#7ce0d0" font-weight="700">+500 美元</text></text>
  <text x="400" y="262" fill="#8fa3c8" font-size="12.5" text-anchor="middle">反向同理：跌 50 点 = 亏 500 美元 —— 杠杆放大了名义仓位，也放大了每点盈亏</text>

  <!-- hand / pip table -->
  <rect x="60" y="300" width="330" height="100" rx="12" fill="#12203a" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="225" y="322" fill="#a7c8ff" font-size="13" font-weight="700" text-anchor="middle">手数 → 每点价值</text>
  <text x="90" y="348" fill="#8fa3c8" font-size="12">1 标准手 → 10 美元</text>
  <text x="90" y="368" fill="#8fa3c8" font-size="12">0.5 手 → 5 美元</text>
  <text x="90" y="388" fill="#8fa3c8" font-size="12">0.1 手（迷你）→ 1 美元</text>

  <rect x="410" y="300" width="330" height="100" rx="12" fill="#31281a" stroke="#f5a623" stroke-width="1.5"/>
  <text x="575" y="322" fill="#ffd9a0" font-size="13" font-weight="700" text-anchor="middle">新手小资金练习唯一正确方式</text>
  <text x="440" y="348" fill="#8fa3c8" font-size="12">0.01 手（微型手）→ 0.1 美元/点</text>
  <text x="440" y="368" fill="#c8d3ea" font-size="12">100 美元账户 + 0.01 手</text>
  <text x="440" y="388" fill="#7ce0d0" font-size="12">每点只亏 0.1 美元，学费可控</text>
</svg>