<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="780" height="440" fill="url(#bgip)" rx="16"/>
  <text x="390" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">信息层级金字塔 —— 越往下，时效越丢、情绪越浓</text>

  <!-- pyramid layers -->
  <polygon points="390,80 250,120 530,120" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="390" y="106" fill="#7ce0d0" font-size="12.5" font-weight="700" text-anchor="middle">官方公告/财报（真相源头）</text>

  <polygon points="250,120 530,120 470,160 310,160" fill="#1e392f" stroke="#26a69a" stroke-width="1.6"/>
  <text x="390" y="146" fill="#a7efe5" font-size="12" text-anchor="middle">分析师 / 机构 · 第一手解读</text>

  <polygon points="310,160 470,160 430,200 350,200" fill="#12203a" stroke="#4e9cf5" stroke-width="1.6"/>
  <text x="390" y="186" fill="#a7c8ff" font-size="12" text-anchor="middle">财经媒体 · 公开报道</text>

  <polygon points="350,200 430,200 410,240 370,240" fill="#3d2c1a" stroke="#f5a623" stroke-width="1.6"/>
  <text x="390" y="226" fill="#ffd9a0" font-size="12" text-anchor="middle">社媒 / 群 / 大V</text>

  <polygon points="370,240 410,240 400,270 380,270" fill="#3d2020" stroke="#ef5350" stroke-width="1.6"/>
  <text x="390" y="262" fill="#ff9d9d" font-size="12" text-anchor="middle">谣言 / 二次加工</text>

  <text x="390" y="312" fill="#ef7a7a" font-size="14" font-weight="700" text-anchor="middle">你看到的那条「重磅利好」</text>
  <text x="390" y="334" fill="#c8d3ea" font-size="13" text-anchor="middle">往往是在帮最早知道的人找买家</text>

  <!-- bottom rule -->
  <rect x="80" y="360" width="620" height="48" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="390" y="382" fill="#ffd9a0" font-size="13" font-weight="700" text-anchor="middle">信息每向下传一层：时效性丢一截，情绪浓度加一分</text>
  <text x="390" y="400" fill="#8fa3c8" font-size="12" text-anchor="middle">凭「人人都知道的消息」交易，你永远是最后一个买家</text>
</svg>