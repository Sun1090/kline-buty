<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgop)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">期权价格拆解 —— 内在价值 + 时间价值</text>

  <!-- bar split -->
  <!-- intrinsic (green) -->
  <rect x="80" y="90" width="240" height="110" rx="10" fill="#11352c" stroke="#26a69a" stroke-width="2"/>
  <text x="200" y="130" fill="#7ce0d0" font-size="16" font-weight="700" text-anchor="middle">内在价值 = 5.0</text>
  <text x="200" y="156" fill="#c8d3ea" font-size="12.5" text-anchor="middle">max(现价−行权价, 0)</text>
  <text x="200" y="178" fill="#8fa3c8" font-size="11.5" text-anchor="middle">"确定的现在"· 立刻行权能赚</text>

  <!-- time value (blue) -->
  <rect x="320" y="90" width="400" height="110" rx="10" fill="#12203a" stroke="#4e9cf5" stroke-width="2"/>
  <text x="520" y="130" fill="#4e9cf5" font-size="16" font-weight="700" text-anchor="middle">时间价值 = 2.5</text>
  <text x="520" y="156" fill="#c8d3ea" font-size="12.5" text-anchor="middle">权利金 7.5 − 内在价值 5.0</text>
  <text x="520" y="178" fill="#8fa3c8" font-size="11.5" text-anchor="middle">"不确定的未来"· 为可能性付的钱</text>

  <!-- total arrow -->
  <line x1="660" y1="145" x2="720" y2="145" stroke="#e8b56e" stroke-width="2.5"/>
  <text x="690" y="137" fill="#e8b56e" font-size="12.5" font-weight="700" text-anchor="middle">权利金 7.5</text>

  <!-- decay example -->
  <rect x="80" y="230" width="640" height="70" rx="12" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="256" fill="#ff9d9d" font-size="13.5" font-weight="700" text-anchor="middle">⚠ 到期时股价还是 100 → 时间价值 2.5 全部蒸发，只剩内在价值 5.0</text>
  <text x="400" y="280" fill="#8fa3c8" font-size="12.5" text-anchor="middle">买方花 2.5 买的是「股价继续上涨的可能性」——而可能性要变成钱，需要股价真的动</text>

  <text x="400" y="342" fill="#c8d3ea" font-size="13" text-anchor="middle">内在价值由「现价 vs 行权价」决定（确定）；时间价值由「波动率 + 剩余时间 + 距离行权价远近」决定（不确定）</text>
  <text x="400" y="374" fill="#5f6f95" font-size="12" text-anchor="middle">没想清楚波动率之前不要下单——波动率是期权交易的灵魂，也是毁灭散户最快的概念</text>
</svg>