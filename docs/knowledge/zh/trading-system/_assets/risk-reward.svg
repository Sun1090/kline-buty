<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgrr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="760" height="400" fill="url(#bgrr)" rx="16"/>
  <text x="380" y="36" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">盈亏比 R:R —— 一单赚多少 / 亏多少，先算清楚再入场</text>

  <!-- entry -->
  <line x1="380" y1="60" x2="380" y2="360" stroke="#4e9cf5" stroke-width="3"/>
  <text x="380" y="54" fill="#4e9cf5" font-size="13" text-anchor="middle">入场价 100</text>

  <!-- TP -->
  <line x1="120" y1="60" x2="120" y2="360" stroke="#26a69a" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="120" y="54" fill="#7ce0d0" font-size="13" text-anchor="middle">止盈 112（奖 12）</text>
  <rect x="120" y="140" width="260" height="120" fill="rgba(38,166,154,0.10)" stroke="rgba(38,166,154,0.5)" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- SL -->
  <line x1="640" y1="60" x2="640" y2="360" stroke="#ef5350" stroke-width="3" stroke-dasharray="7 4"/>
  <text x="640" y="54" fill="#ef7a7a" font-size="13" text-anchor="middle">止损 96（亏 4）</text>
  <rect x="380" y="140" width="260" height="120" fill="rgba(239,83,80,0.08)" stroke="rgba(239,83,80,0.5)" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- labels -->
  <text x="250" y="180" fill="#7ce0d0" font-size="14" text-anchor="middle" font-weight="700">盈利空间 = 12</text>
  <text x="510" y="180" fill="#ef7a7a" font-size="14" text-anchor="middle" font-weight="700">亏损空间 = 4</text>

  <text x="380" y="250" fill="#c8d3ea" font-size="15" text-anchor="middle" font-weight="700">R:R = 盈利 ÷ 亏损 = 12 ÷ 4 = <tspan fill="#7ce0d0">3 : 1</tspan></text>

  <!-- formula row -->
  <rect x="60" y="300" width="640" height="58" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="380" y="326" fill="#c8d3ea" font-size="13.5" text-anchor="middle">胜率 25% + R:R 3:1 → 均值：4 单中 1 胜（+12）3 负（−4×3）→ 期望 = 12 − 12 = 0</text>
  <text x="380" y="346" fill="#8fa3c8" font-size="12.5" text-anchor="middle">理念：允许「小亏多」，靠「大赚少」取胜——前提 R:R ≥ 2:1 且严格执行止损。</text>
</svg>