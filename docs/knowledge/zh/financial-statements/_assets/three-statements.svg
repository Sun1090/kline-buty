<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg3s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
    <marker id="arr3S" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8fa3c8"/></marker>
  </defs>
  <rect width="800" height="430" fill="url(#bg3s)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">三张报表勾稽关系 —— 造假必须同时圆三张表，缝隙永远存在</text>

  <!-- Balance sheet (middle top) -->
  <rect x="280" y="70" width="240" height="76" rx="12" fill="#12203a" stroke="#4e9cf5" stroke-width="2.2"/>
  <text x="400" y="96" fill="#a7c8ff" font-size="15" font-weight="700" text-anchor="middle">资产负债表</text>
  <text x="400" y="118" fill="#8fa3c8" font-size="12" text-anchor="middle">家底：资产 = 负债 + 所有者权益</text>
  <text x="400" y="137" fill="#8fa3c8" font-size="11.5" text-anchor="middle">（含未分配利润）</text>

  <!-- Income statement (left) -->
  <rect x="40" y="200" width="240" height="76" rx="12" fill="#11352c" stroke="#26a69a" stroke-width="2.2"/>
  <text x="160" y="226" fill="#7ce0d0" font-size="15" font-weight="700" text-anchor="middle">利润表</text>
  <text x="160" y="248" fill="#8fa3c8" font-size="12" text-anchor="middle">面子：收入 − 成本 − 税 = 净利润</text>
  <text x="160" y="267" fill="#8fa3c8" font-size="11.5" text-anchor="middle">扣非净利润才真实</text>

  <!-- Cash flow (right) -->
  <rect x="520" y="200" width="240" height="76" rx="12" fill="#3d2c1a" stroke="#f5a623" stroke-width="2.2"/>
  <text x="640" y="226" fill="#ffd9a0" font-size="15" font-weight="700" text-anchor="middle">现金流量表</text>
  <text x="640" y="248" fill="#8fa3c8" font-size="12" text-anchor="middle">里子：经营/投资/筹资三大活动</text>
  <text x="640" y="267" fill="#8fa3c8" font-size="11.5" text-anchor="middle">经营现金流才是事实</text>

  <!-- connections -->
  <line x1="284" y1="190" x2="210" y2="196" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arr3S)"/>
  <line x1="516" y1="200" x2="580" y2="196" stroke="#8fa3c8" stroke-width="2" marker-end="url(#arr3S)"/>
  <text x="240" y="290" fill="#7ce0d0" font-size="11.5" text-anchor="middle">净利润 → 未分配利润</text>
  <text x="590" y="290" fill="#ffd9a0" font-size="11.5" text-anchor="middle">现金流 ↔ 货币资金</text>

  <!-- audit loop -->
  <text x="400" y="330" fill="#c8d3ea" font-size="13.5" text-anchor="middle" font-weight="700">交叉验证：任何两个对不上，就有一个在撒谎</text>
  <rect x="140" y="348" width="520" height="56" rx="10" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="370" fill="#ff9d9d" font-size="12.5" text-anchor="middle">⚠ 净利润涨但经营现金流原地踏步 → 收入可能是「赊出来的」</text>
  <text x="400" y="391" fill="#ff9d9d" font-size="12.5" text-anchor="middle">⚠ 应收增速远超收入 / 大额借款但货币资金不增 → 资金被占用或体外循环</text>
</svg>