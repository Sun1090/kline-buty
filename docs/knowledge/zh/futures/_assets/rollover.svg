<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bgroll)" rx="16"/>
  <text x="400" y="32" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">移仓换月（展期）—— 资金在交割前 1~2 个月「搬家」</text>

  <!-- time axis -->
  <line x1="70" y1="210" x2="730" y2="210" stroke="#8fa3c8" stroke-width="2.5" marker-end="url(#arrRoll)"/>
  <text x="738" y="214" fill="#8fa3c8" font-size="12">时间</text>

  <!-- old contract oi curve drops -->
  <text x="150" y="80" fill="#ffd9a0" font-size="13" font-weight="700" text-anchor="middle">旧主力合约</text>
  <text x="150" y="100" fill="#8fa3c8" font-size="11.5" text-anchor="middle">持仓量持续下降</text>
  <path d="M 100 120 C 170 100 240 130 300 150 S 420 180 470 195" fill="none" stroke="#f5a623" stroke-width="2.6"/>
  <text x="474" y="210" fill="#f5a623" font-size="11">旧合约 OI 衰减 ↓</text>

  <!-- new contract oi curve rises -->
  <text x="620" y="80" fill="#7ce0d0" font-size="13" font-weight="700" text-anchor="middle">新主力合约</text>
  <text x="620" y="100" fill="#8fa3c8" font-size="11.5" text-anchor="middle">持仓量加速上升</text>
  <path d="M 470 195 C 540 175 600 130 700 105" fill="none" stroke="#26a69a" stroke-width="2.6"/>
  <text x="480" y="180" fill="#26a69a" font-size="11">新合约 OI 上升 ↑</text>

  <!-- crossing -->
  <circle cx="470" cy="195" r="6" fill="#eef2ff"/>
  <text x="470" y="272" fill="#c8d3ea" font-size="13" font-weight="700" text-anchor="middle">交接点：新持仓 > 旧持仓，主力易主</text>

  <!-- timeline markers -->
  <rect x="60" y="300" width="130" height="44" rx="8" fill="#12203a" stroke="#4e9cf5" stroke-width="1.5"/>
  <text x="125" y="318" fill="#a7c8ff" font-size="12" font-weight="700" text-anchor="middle">T-2月</text>
  <text x="125" y="335" fill="#8fa3c8" font-size="10.5" text-anchor="middle">开始移仓</text>
  <rect x="340" y="300" width="140" height="44" rx="8" fill="#3d2c1a" stroke="#f5a623" stroke-width="1.5"/>
  <text x="410" y="318" fill="#ffd9a0" font-size="12" font-weight="700" text-anchor="middle">T-1月</text>
  <text x="410" y="335" fill="#8fa3c8" font-size="10.5" text-anchor="middle">主力交接完成</text>
  <rect x="620" y="300" width="130" height="44" rx="8" fill="#3d2020" stroke="#ef5350" stroke-width="1.5"/>
  <text x="685" y="318" fill="#ff9d9d" font-size="12" font-weight="700" text-anchor="middle">交割月</text>
  <text x="685" y="335" fill="#8fa3c8" font-size="10.5" text-anchor="middle">旧合约退场</text>

  <text x="400" y="376" fill="#8fa3c8" font-size="12.5" text-anchor="middle">对交易者：卖出旧主力平仓 + 买入新主力开仓 = 展期（Roll）。软件用「主力合约」代码（rb2510）自动跟踪。</text>

  <defs><marker id="arrRoll" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8fa3c8"/></marker></defs>
</svg>