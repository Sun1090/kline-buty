<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgbp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bgbp)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">五层书单金字塔 —— 读完一层，再进下一层</text>

  <!-- 金字塔: 顶小底大, 中心 x=310, 底 y=380, 每层高 62 -->
  <!-- 第5层 精读方法 -->
  <polygon points="310,80 352,142 268,142" fill="#c792ea" opacity="0.9"/>
  <!-- 第4层 量化心理 -->
  <polygon points="268,146 352,146 394,208 226,208" fill="#e8b56e" opacity="0.9"/>
  <!-- 第3层 价值 -->
  <polygon points="226,212 394,212 436,274 184,274" fill="#26a69a" opacity="0.9"/>
  <!-- 第2层 技术 -->
  <polygon points="184,278 436,278 478,340 142,340" fill="#4e9cf5" opacity="0.9"/>
  <!-- 第1层 入门 -->
  <polygon points="142,344 478,344 520,398 100,398" fill="#ef5350" opacity="0.85"/>

  <!-- 层内标签 -->
  <text x="310" y="122" fill="#0d1220" font-size="12" font-weight="700" text-anchor="middle">精读方法</text>
  <text x="310" y="182" fill="#0d1220" font-size="12.5" font-weight="700" text-anchor="middle">量化与心理</text>
  <text x="310" y="248" fill="#0d1220" font-size="13" font-weight="700" text-anchor="middle">价值投资</text>
  <text x="310" y="314" fill="#0d1220" font-size="13.5" font-weight="700" text-anchor="middle">技术分析</text>
  <text x="310" y="376" fill="#0d1220" font-size="14" font-weight="700" text-anchor="middle">入门启蒙</text>

  <!-- 右侧说明 -->
  <g font-size="13" fill="#c8d3ea">
    <text x="540" y="100"><tspan fill="#c792ea" font-weight="700">第五层</tspan> 学会读书本身</text>
    <text x="556" y="120" fill="#8fa3c8" font-size="12">把前四层读透，变成自己的体系</text>
    <text x="540" y="166"><tspan fill="#e8b56e" font-weight="700">第四层</tspan> 建立心理防线</text>
    <text x="556" y="186" fill="#8fa3c8" font-size="12">了解人性弱点与不确定性</text>
    <text x="540" y="232"><tspan fill="#26a69a" font-weight="700">第三层</tspan> 基本面框架</text>
    <text x="556" y="252" fill="#8fa3c8" font-size="12">知道什么值得长期持有</text>
    <text x="540" y="298"><tspan fill="#4e9cf5" font-weight="700">第二层</tspan> 看图能力</text>
    <text x="556" y="318" fill="#8fa3c8" font-size="12">看懂图表，知道信号从哪来</text>
    <text x="540" y="364"><tspan fill="#ef5350" font-weight="700">第一层</tspan> 建立金钱观</text>
    <text x="556" y="384" fill="#8fa3c8" font-size="12">先学会「不亏」和「慢慢变富」</text>
  </g>

  <text x="400" y="424" fill="#8fa3c8" font-size="12.5" text-anchor="middle">五层不必全读完：做短线重点在第二+四层，做配置重点在第一+三层；别一上来就啃《证券分析》</text>
</svg>
