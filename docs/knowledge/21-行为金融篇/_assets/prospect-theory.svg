<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgpt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#101224"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bgpt)" rx="16"/>
  <text x="400" y="34" fill="#eef2ff" font-size="20" font-weight="700" text-anchor="middle">前景理论价值函数 —— 参考点是原点，忽略参考点就无法理解亏损厌恶</text>

  <!-- axes -->
  <line x1="400" y1="60" x2="400" y2="390" stroke="#8fa3c8" stroke-width="2.5"/>
  <line x1="90" y1="225" x2="720" y2="225" stroke="#8fa3c8" stroke-width="2.5"/>
  <text x="415" y="72" fill="#8fa3c8" font-size="13">价值（心理感受）↑</text>
  <text x="720" y="245" fill="#8fa3c8" font-size="13">盈亏变化量 →</text>
  <text x="400" y="252" fill="#e8b56e" font-size="13" font-weight="700" text-anchor="middle">参考点（原点）</text>

  <!-- gain curve (concave) -->
  <path d="M 400 225 Q 480 160 560 130 Q 630 105 690 88" fill="none" stroke="#26a69a" stroke-width="3.5"/>
  <!-- loss curve (steeper convex) -->
  <path d="M 400 225 Q 320 285 245 330 Q 170 365 115 382" fill="none" stroke="#ef5350" stroke-width="3.5"/>

  <!-- labels -->
  <text x="560" y="118" fill="#7ce0d0" font-size="13">盈利域：越来越「平」</text>
  <text x="560" y="137" fill="#8fa3c8" font-size="12">确定性小赚 > 概率大赚（风险规避）</text>
  <text x="110" y="402" fill="#ff9d9d" font-size="13">亏损域：明显「更陡」</text>

  <!-- 2x annotation -->
  <circle cx="245" cy="330" r="5" fill="#ef5350"/>
  <circle cx="560" cy="130" r="5" fill="#26a69a"/>
  <text x="245" y="352" fill="#ff9d9d" font-size="12.5">−100 的痛苦</text>
  <text x="560" y="160" fill="#7ce0d0" font-size="12.5">+100 的快乐</text>
  <text x="398" y="190" fill="#e8b56e" font-size="13.5" font-weight="700">痛苦 ≈ 快乐的 2 倍</text>

  <!-- dashed symmetry guide -->
  <line x1="245" y1="330" x2="560" y2="130" stroke="#e8b56e" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>

  <!-- trading implication -->
  <rect x="110" y="418" width="580" height="34" rx="8" fill="#0d1526" stroke="#3d4a6b" stroke-width="1.5"/>
  <text x="400" y="440" fill="#c8d3ea" font-size="12.5" text-anchor="middle">死扛亏损单都源于此：砍仓＝把「账面亏损」变成「确认亏损」，心理痛苦立刻加倍，于是宁愿继续扛</text>
</svg>