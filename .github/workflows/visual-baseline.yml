name: Visual baseline (Linux)

# 排队项 ③：视觉基线只有 darwin 一份，CI 不跑 `visual.spec.ts`，基线漂了没人察觉。
# 本 workflow 手工触发（workflow_dispatch），在 ubuntu 上生成 linux 基线并**当场复跑一次**验证
# 确定性——第二遍不带 `--update-snapshots`，跑不过就说明该基线在 CI 上本身会 flake，不能入库。
# 产物是 4 张 `*-chromium-linux.png`，下载后随 PR 提交；提交后把规格加进 CI 的 E2E 清单。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate + verify linux baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate baselines
        run: npx playwright test e2e/visual.spec.ts --project=chromium --update-snapshots --retries=0
      - name: Re-run against the generated baselines (determinism gate)
        run: npx playwright test e2e/visual.spec.ts --project=chromium --retries=0
      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baseline-linux
          path: e2e/visual.spec.ts-snapshots/*-chromium-linux.png
          retention-days: 14
      - name: Upload E2E report on failure
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
        if: failure()
