name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 项目站点部署在子路径 /kline-buty/，资源路径需带 base
      # 应用构建（子路径 base）+ 文档站构建（知识库 base=/kline-buty/knowledge/，产物合并进 dist/knowledge）
      - run: npm run build
        env:
          VITE_BASE_PATH: /kline-buty/
          DOCS_BASE_PATH: /kline-buty/knowledge/
          DOCS_SITE_URL: https://sun1090.github.io
      # SPA fallback：GitHub Pages 用 404.html 兜底
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
