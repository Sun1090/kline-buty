name: CI

# O13 CI 并行化：把原先单一顺序 job（typecheck→lint→validate→test→build ~4-5min）
# 拆为 4 个相互独立、并行执行的 job，墙钟时间 ≈ 最慢单 job（~2min）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
        if: always()

  docs:
    name: Knowledge base validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate knowledge base
        run: python3 docs/knowledge/scripts/validate-knowledge.py
      - name: Knowledge base structure lint
        run: npm run docs:lint
      - name: Knowledge base anchor check
        run: npm run docs:anchor
      - name: Docs-site component tests (G1)
        run: npm run test:docs

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
        if: always()

  dependency-audit:
    name: Dependency audit (prod only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 生产依赖硬门禁：high/critical 即失败。dev 侧 vitepress 工具链告警（无修复、仅 dev server）
      # 由 dependabot 跟进，不阻塞本 job——见 docs/13「已知欠账」与 .npmrc 注释。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
