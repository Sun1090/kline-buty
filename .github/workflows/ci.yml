name: CI

# O13 CI 并行化：把原先单一顺序 job（typecheck→lint→validate→test→build ~4-5min）
# 拆为 4 个相互独立、并行执行的 job，墙钟时间 ≈ 最慢单 job（~2min）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
        if: always()

  docs:
    name: Knowledge base validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate knowledge base
        run: python3 docs/knowledge/scripts/validate-knowledge.py
      - name: Knowledge base structure lint
        run: npm run docs:lint
      - name: Knowledge base anchor check
        run: npm run docs:anchor
      - name: Docs-site component tests (G1)
        run: npm run test:docs

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
        if: always()

  dependency-audit:
    name: Dependency audit (prod only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 生产依赖硬门禁：high/critical 即失败。dev 侧 vitepress 工具链告警（无修复、仅 dev server）
      # 由 dependabot 跟进，不阻塞本 job——见 docs/13「已知欠账」与 .npmrc 注释。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e-tests:
    name: E2E (deterministic, 3 browsers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        # H11：本地 firefox nightly 有 macOS headless 上游 bug（Could not find profile folder），
        # Linux CI 可全跑三浏览器。--with-deps 装系统依赖（apt，需 sudo）。
        run: npx playwright install --with-deps chromium webkit firefox
      # 跑哪些规格由 e2e/ci-specs.json 决定（唯一清单，npm run e2e:ci 读取它）。
      # 入选标准：?perf 合成数据驱动，不依赖币安网络连通性（GitHub 运行器到币安的
      # 出口/geo 不可控）；实时数据冒烟（smoke/feature-gaps/market-tape/chart-ready）
      # 留本地，账本里逐条记着原因。
      # 历史：limit-orders / tpsl-guard / partial-close 此前不在清单里，成交价与止盈止损
      # 的回归只能靠本地全量跑发现（v0.5.24 补入）；visual 自 v0.5.29 补入——基线按平台
      # 分文件，linux 那份由 Visual baseline (Linux) workflow 生成并当场复跑验证过确定性。
      # 新增规格若忘了登记，scripts/__tests__/ci-specs.test.ts 会在单测阶段变红。
      - name: E2E tests
        run: npm run e2e:ci
      - name: Upload E2E report on failure
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
        if: failure()
