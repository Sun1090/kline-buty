server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    # SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（带 hash 的 assets）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 币安现货数据代理（对应前端 /api 前缀）
    location /api/ {
        proxy_pass https://data-api.binance.vision;
        proxy_ssl_server_name on;
        proxy_set_header Host data-api.binance.vision;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 币安实时流代理（WebSocket）
    location /ws/ {
        proxy_pass https://stream.binance.com:443;
        proxy_ssl_server_name on;
        proxy_set_header Host stream.binance.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 币安永续数据代理（资金费率/未平仓）
    location /fapi/ {
        proxy_pass https://fapi.binance.com;
        proxy_ssl_server_name on;
        proxy_set_header Host fapi.binance.com;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Service Worker 不缓存
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
