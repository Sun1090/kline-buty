<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#131722" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <title>Kline Buty · 实时 K 线</title>
    <style>
      :root {
        --bg: #131722;
        --panel: #1e222d;
        --border: #2a2e39;
        --text: #d1d4dc;
        --text-dim: #9aa7b5;
        --text-faint: #5d6673;
        --accent: #2962ff;
        --up: #26a69a;
        --down: #ef5350;
        --yellow: #f5c02f;
        --grid: rgba(42,46,57,0.6);
      }
      html[data-theme='light'] {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --border: #d9dde5;
        --text: #1e222d;
        --text-dim: #5d6673;
        --text-faint: #9aa7b5;
        --accent: #2962ff;
        --up: #0d9480;
        --down: #dc4a4a;
        --yellow: #b8860b;
        --grid: rgba(30,34,45,0.08);
      }
      html, body, #root { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* 移动端手势打磨：去掉 iOS 点击灰闪、按钮禁用双击缩放延迟、禁页面回弹/下拉刷新 */
      html { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      body { overscroll-behavior: none; }
      button { touch-action: manipulation; }
      /* K 线区触摸手势（平移/双指缩放）归图表，不滚动页面（含 lwc 内部包装层） */
      .chart-container, .chart-container * { touch-action: none; }
      /* 桌面顶栏单行：内部工具栏可横滚但隐藏滚动条，避免出现横向滚动条 */
      header[data-testid="desktop-header"] .scroll-toolbar { scrollbar-width: none; -ms-overflow-style: none; }
      header[data-testid="desktop-header"] .scroll-toolbar::-webkit-scrollbar { display: none; }
      /* 工具栏横向滚动条细且不挤占空间 */
      .scroll-toolbar { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      .scroll-toolbar::-webkit-scrollbar { height: 4px; }
      .scroll-toolbar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
      /* 实时跳动：WS 帧到达时最新价高亮闪烁一次（涨绿/跌红），让实时行情肉眼可见 */
      .tick-flash-up { animation: tick-flash-up 1s ease-out; }
      .tick-flash-down { animation: tick-flash-down 1s ease-out; }
      @keyframes tick-flash-up { 0% { background: rgba(38,166,154,0.45); } 100% { background: transparent; } }
      @keyframes tick-flash-down { 0% { background: rgba(239,83,80,0.45); } 100% { background: transparent; } }
      @keyframes live-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      /* T10 图表首屏骨架屏：K 线占位条 shimmer（仅 loading 且无数据时显示） */
      .kb-skeleton { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
      .kb-skeleton span { width: 10px; border-radius: 2px; background: var(--border); animation: kb-shimmer 1.4s ease-in-out infinite; }
      @keyframes kb-shimmer { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
